<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" fill="none" role="img" aria-label="weaid.in">
  <!-- left hand → left strokes of the W (teal) -->
  <path d="M7 16 L19 47 L32 26" stroke="#1A6E5E" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right hand → right upstroke of the W, checkmark-tall (orange) -->
  <path d="M32 26 L45 47 L58 11" stroke="#F5851F" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- clasp knuckles hint at the join -->
  <circle cx="30.5" cy="33.5" r="2.1" fill="#0F5044"/>
  <circle cx="35.5" cy="31" r="2.1" fill="#C4670F"/>
</svg>
