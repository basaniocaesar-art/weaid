<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Offer a ride — WeAid Carpool</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0f14;--mut:#5b6573;--line:#e7ebf0;--bg:#f6f8fa;--teal:#0d9488;--teal-d:#0f766e;--orange:#f97316;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:24px;margin:6px 0 4px}h3{margin:20px 4px 8px}.mut{color:var(--mut);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
label{display:block;font-size:13px;font-weight:700;margin-top:10px}
input,textarea{display:block;width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);margin-top:4px;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;width:100%;text-align:center;font:inherit;font-weight:800;font-size:16px;padding:13px;border-radius:14px;border:0;background:linear-gradient(90deg,var(--teal),var(--orange));color:#fff;margin-top:12px;cursor:pointer}
.btn.light{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.red{background:#fff;color:var(--red);border:1.5px solid var(--line)}
.btn:disabled{opacity:.6}.err{color:var(--red);font-size:14px;margin-top:8px}
.price{font-size:26px;font-weight:800;color:var(--teal-d)}
.pax{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.pax input{width:90px;font-size:18px;letter-spacing:.2em;text-align:center;padding:8px;margin:0}
.pill{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:#eef2f6}
</style>
</head>
<body><main id="app"><div class="mut">Loading…</div></main>
<script src="/carpool-places.js"></script>
<script>
const T = new URLSearchParams(location.hash.slice(1)).get("t") || "";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = (iso) => new Date(iso).toLocaleString("en-IN", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN");
const app = document.getElementById("app");
async function api(body) {
  const r = await fetch("/api/carpool/drive", { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", "X-Pro-Token": T }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "Something went wrong."); return d;
}
let data = null;
async function load() {
  try { data = await api(); } catch (e) { app.innerHTML = `<h1>Please open this from the WeAid Pro app</h1><div class="mut">${esc(e.message)}</div>`; return; }
  render();
}
function render() {
  const open = data.rides.filter((r) => ["open", "full"].includes(r.status));
  const past = data.rides.filter((r) => !["open", "full"].includes(r.status));
  app.innerHTML = `<h1>Offer a ride</h1><div class="mut">Going somewhere anyway? Share the empty seats and the fuel cost. WeAid sets a fair price per seat from the distance, collects it from passengers, and pays you after the trip.</div>
    ${data.me.verified ? `<div class="card" id="form">
      <label>Leaving from<input id="from" placeholder="e.g. Kakkanad" autocomplete="off"></label>
      <label>Going to<input id="to" placeholder="e.g. Thrissur" autocomplete="off"></label>
      <div id="quote" class="mut" style="margin-top:8px"></div>
      <label>Stops on the way (optional)<input id="s1" placeholder="e.g. Aluva" autocomplete="off"></label>
      <input id="s2" placeholder="Another stop (optional)" autocomplete="off">
      <div class="two"><label>Leaving at<input id="when" type="datetime-local"></label><label>Free seats<input id="seats" type="number" min="1" max="6" value="3"></label></div>
      <div class="two"><label>Car<input id="car" placeholder="e.g. Maruti Swift"></label><label>Car number<input id="num" placeholder="KL 07 AB 1234"></label></div>
      <label>Note for passengers (optional)<input id="notes" placeholder="e.g. one small bag each, AC car"></label>
      <button class="btn" id="post">Post my ride</button><div class="err" id="err"></div></div>`
    : `<div class="card"><b>Verify first</b><div class="mut">Carpool drivers must be verified with their driving licence. Go back and tap "Verify my ID" in WeAid Pro.</div></div>`}
    <h3>${open.length ? "Your upcoming rides" : ""}</h3>${open.map(rideCard).join("")}
    ${past.length ? `<h3>Earlier</h3>${past.map(rideCard).join("")}` : ""}`;
  if (data.me.verified) wireForm();
  wireRides();
}
function rideCard(r) {
  const live = ["open", "full"].includes(r.status), started = Date.now() > Date.parse(r.depart_at);
  return `<div class="card"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(r.from_address)} → ${esc(r.to_address)}</b><span class="pill">${esc(r.status)}</span></div>
    <div class="mut">${esc(when(r.depart_at))} · ${inr(r.price_per_seat)}/seat · ${r.seats_total - r.seats_left}/${r.seats_total} booked</div>
    ${r.passengers.length ? r.passengers.map((p) => `<div class="pax"><div><b>${esc(p.name)}</b> · ${p.seats} seat${p.seats > 1 ? "s" : ""}<div class="mut">${esc(p.pickup || "")} <a href="tel:${esc(p.phone)}">${esc(p.phone)}</a></div></div>
      ${p.status === "confirmed" && live ? `<div><input data-code="${p.id}" inputmode="numeric" maxlength="4" placeholder="code"><button class="btn light" style="margin-top:4px;padding:6px" data-board="${p.id}">Board</button></div>` : `<span class="pill">${p.status === "boarded" ? "✓ on board" : esc(p.status)}</span>`}</div>`).join("") : `<div class="mut" style="margin-top:6px">No passengers yet.</div>`}
    ${r.status === "done" ? `<div style="margin-top:8px">You earned <b>${inr(r.earnings)}</b>${r.payout_sent_at ? " — paid ✓" : " — WeAid pays you by UPI this week"}</div>` : ""}
    ${live && started ? `<button class="btn" data-done="${r.id}">🏁 Trip finished</button>` : ""}
    ${live ? `<button class="btn red" data-cancel="${r.id}">Cancel this ride</button>` : ""}<div class="err" id="e${r.id}"></div></div>`;
}
function wireForm() {
  const from = document.getElementById("from"), to = document.getElementById("to");
  const quote = async () => {
    if (!from.place || !to.place) return;
    try { const q = await api({ action: "quote", from: from.place, to: to.place }); document.getElementById("quote").innerHTML = `About ${q.km} km — passengers pay <span class="price">${inr(q.price)}</span> per seat (fuel share). You receive ${inr(q.price)} per seat that travels.`; }
    catch (e) { document.getElementById("quote").textContent = e.message; }
  };
  attachPlace(from, quote); attachPlace(to, quote); attachPlace(document.getElementById("s1")); attachPlace(document.getElementById("s2"));
  document.getElementById("post").onclick = async (e) => {
    const err = document.getElementById("err"); err.textContent = "";
    const w = document.getElementById("when").value;
    e.target.disabled = true;
    try {
      await api({ action: "create", from: from.place, to: to.place, departAt: w ? new Date(w).toISOString() : null, seats: document.getElementById("seats").value,
        carModel: document.getElementById("car").value, carNumber: document.getElementById("num").value, notes: document.getElementById("notes").value,
        stops: ["s1", "s2"].map((id) => document.getElementById(id).place).filter(Boolean) });
      await load();
    } catch (x) { err.textContent = x.message; e.target.disabled = false; }
  };
}
function wireRides() {
  app.querySelectorAll("[data-board]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.board, code = app.querySelector(`[data-code="${id}"]`).value;
    try { await api({ action: "board", seatId: id, code }); load(); } catch (x) { alert(x.message); }
  });
  app.querySelectorAll("[data-done]").forEach((b) => b.onclick = async () => {
    if (!confirm("Finish this trip? Passengers who weren't boarded are marked no-show.")) return;
    try { const d = await api({ action: "complete", rideId: b.dataset.done }); alert(`Trip finished. You earned ${inr(d.owed)} — WeAid pays you by UPI.`); load(); } catch (x) { document.getElementById("e" + b.dataset.done).textContent = x.message; }
  });
  app.querySelectorAll("[data-cancel]").forEach((b) => b.onclick = async () => {
    const reason = prompt("Why are you cancelling? Passengers get a full refund."); if (reason === null) return;
    try { await api({ action: "cancel", rideId: b.dataset.cancel, reason }); load(); } catch (x) { document.getElementById("e" + b.dataset.cancel).textContent = x.message; }
  });
}
load();
</script>
</body>
</html>
