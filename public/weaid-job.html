<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your WeAid job</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#f97316;--ink:#0b0f14;--mut:#5b6573;--line:#e7ebf0;--bg:#f6f8fa;--teal:#0d9488;--teal-d:#0f766e;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5}
.top{background:#fff;border-bottom:1px solid var(--line)}.top div{max-width:560px;margin:0 auto;padding:14px 16px;font-weight:800;font-size:20px}.top b{color:var(--orange)}
main{max-width:560px;margin:0 auto;padding:16px 16px 60px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;margin-bottom:12px}
h1{font-size:24px;margin:0 0 4px}.mut{color:var(--mut);font-size:14px}
.row{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}.row:last-child{border:0}
.btn{display:block;width:100%;text-align:center;text-decoration:none;font:inherit;font-weight:800;font-size:18px;padding:16px;border-radius:14px;border:0;background:var(--ink);color:#fff;margin-top:10px;cursor:pointer}
.btn.teal{background:var(--teal)}.btn:disabled{opacity:.45}.btn.light{background:#fff;color:var(--ink);border:1.5px solid var(--line);font-size:16px;padding:13px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.chips button{flex:1;min-width:70px;padding:11px;border-radius:12px;border:1.5px solid var(--line);background:#fff;font:inherit;font-weight:700;cursor:pointer}.chips button.on{border-color:var(--teal);background:#f0fdfa;color:var(--teal-d)}
input,textarea{width:100%;font:inherit;font-size:28px;letter-spacing:.3em;text-align:center;padding:12px;border-radius:12px;border:1.5px solid var(--line);margin-top:8px}
textarea{font-size:16px;letter-spacing:0;text-align:left}
.err{color:var(--red);font-size:14px;margin-top:8px}
.live{background:#f0fdfa;border:1px solid #99f6e4;color:var(--teal-d);border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
</style>
</head>
<body>
<div class="top"><div><img src="/icon-192.png" alt="" style="width:30px;height:30px;vertical-align:middle;margin-right:6px;border-radius:7px">We<b>Aid</b> <span class="mut" style="font-weight:600">· pro</span></div></div>
<main>
  <div class="card" id="head"><div class="mut">Loading the job…</div></div>
  <div class="card" id="info" hidden></div>
  <div class="card" id="act" hidden></div>
</main>
<script>
const q = new URLSearchParams(location.search);
const B = q.get("b"), K = q.get("k");
const API = `/api/job?b=${encodeURIComponent(B || "")}&k=${encodeURIComponent(K || "")}`;
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = (iso) => iso ? new Date(iso).toLocaleString("en-IN", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "As soon as possible";
let job, eta = 20, watchId = null, lastSent = 0, wake = null;

function here() {
  return new Promise((res) => {
    if (!navigator.geolocation) return res({});
    navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res({}), { enableHighAccuracy: true, timeout: 8000 });
  });
}
async function post(body) {
  const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Something went wrong. Try again.");
  return d;
}
function startSharing() {
  if (!navigator.geolocation || watchId !== null) return;
  watchId = navigator.geolocation.watchPosition((p) => {
    if (Date.now() - lastSent < 15000) return;
    lastSent = Date.now();
    post({ action: "location", lat: p.coords.latitude, lng: p.coords.longitude }).catch(() => {});
  }, () => {}, { enableHighAccuracy: true, maximumAge: 10000 });
  if ("wakeLock" in navigator) navigator.wakeLock.request("screen").then((w) => (wake = w)).catch(() => {});
}
function stopSharing() {
  if (watchId !== null) navigator.geolocation.clearWatch(watchId);
  watchId = null;
  if (wake) wake.release().catch(() => {});
}

async function photo(kind, file) {
  if (!file) return;
  const busy = document.getElementById("pBusy"); if (busy) busy.textContent = "Uploading…";
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
    const sc = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    job = { ...job, ...(await post({ action: "photo", kind, mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.82) })) };
    render();
  } catch (x) { if (busy) busy.textContent = ""; const e = document.getElementById("err"); if (e) e.textContent = x.message || "Couldn't upload. Try again."; }
}

function render() {
  const d = job;
  document.getElementById("head").innerHTML =
    `<div class="mut">${esc((d.service || "").replace(/_/g, " "))} · ${esc(d.scope || "")} job</div><h1>${esc(d.words)}</h1>` +
    (d.earnings != null ? `<div class="mut">You earn <b style="color:var(--ink)">₹${d.earnings}</b>${d.paid ? " · customer has paid WeAid" : " · payment to be confirmed"}</div>` : "");

  const C = d.courier;
  const tgt = C && d.stage === "in_transit" ? C.drop : null;
  const maps = tgt ? `https://www.google.com/maps/dir/?api=1&destination=${tgt.lat},${tgt.lng}` : d.pin ? `https://www.google.com/maps/dir/?api=1&destination=${d.pin.lat},${d.pin.lng}` : d.address ? `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(d.address)}` : null;
  const info = document.getElementById("info");
  info.hidden = false;
  info.innerHTML =
    `<div class="row"><span class="mut">When</span><span>${esc(when(d.when))}</span></div>` +
    (d.description ? `<div class="row"><span class="mut">Problem</span><span style="text-align:right">${esc(d.description)}</span></div>` : "") +
    `<div class="row"><span class="mut">Customer</span><span>${esc(d.customer.name)}</span></div>` +
    (C ? `<div class="row"><span class="mut">Pick up</span><span style="text-align:right">${esc(C.pickup.name)}</span></div><div class="row"><span class="mut">Drop</span><span style="text-align:right">${esc(C.drop.name)} · ${C.km} km</span></div>${C.item ? `<div class="row"><span class="mut">Item</span><span style="text-align:right">${esc(C.item)}</span></div>` : ""}${C.receiver ? `<div class="row"><span class="mut">Receiver</span><span>${esc(C.receiver.name)}</span></div>` : ""}`
      : d.address ? `<div class="row"><span class="mut">Address</span><span style="text-align:right">${esc(d.address)}</span></div>` : "") +
    (maps ? `<a class="btn light" href="${maps}" target="_blank" rel="noopener">🧭 Directions ${C ? (d.stage === "in_transit" ? "to the drop" : "to the pickup") : "in Google Maps"}</a>` : "") +
    (C && C.receiver && d.stage === "in_transit" ? `<a class="btn light" href="tel:${esc(C.receiver.phone)}">📞 Call receiver (${esc(C.receiver.name.split(" ")[0])})</a>` : "") +
    (d.customer.phone ? `<a class="btn light" href="tel:${esc(d.customer.phone)}">📞 Call ${esc(d.customer.name.split(" ")[0] || "customer")}</a>` : "");

  const act = document.getElementById("act");
  act.hidden = false;
  if (["assigned", "finding", "unpaid"].includes(d.stage)) {
    stopSharing();
    act.innerHTML = `<b>Leaving now?</b><div class="mut">How long to get there?</div>
      <div class="chips">${[10, 20, 30, 45, 60].map((m) => `<button data-m="${m}" class="${m === eta ? "on" : ""}">${m} min</button>`).join("")}</div>
      <button class="btn teal" id="go">🚗 I'm on my way</button>
      <div class="mut" style="margin-top:8px">The customer will see you coming on a map. Keep this page open while you travel.</div><div class="err" id="err"></div>`;
    act.querySelectorAll("[data-m]").forEach((b) => b.onclick = () => { eta = +b.dataset.m; render(); });
    act.querySelector("#go").onclick = async (e) => {
      e.target.disabled = true; e.target.textContent = "Sharing your location…";
      try { const pos = await here(); job = { ...job, ...(await post({ action: "on_the_way", eta_minutes: eta, ...pos })) }; startSharing(); render(); }
      catch (x) { document.getElementById("err").textContent = x.message; e.target.disabled = false; e.target.textContent = "🚗 I'm on my way"; }
    };
  } else if (d.stage === "on_the_way") {
    startSharing();
    act.innerHTML = `<div class="live">📍 Sharing your location with the customer. Keep this page open until you arrive.</div>
      <div style="margin-top:14px"><b>Arrived?</b> Ask the customer for their 4-digit WeAid code.${d.quoteJob ? " Then measure up and write the quote." : ""}</div>
      <input id="code" inputmode="numeric" maxlength="4" placeholder="• • • •" autocomplete="one-time-code">
      <button class="btn teal" id="arr">✅ I've arrived</button><div class="err" id="err"></div>`;
    act.querySelector("#arr").onclick = async (e) => {
      e.target.disabled = true;
      try { const pos = await here(); job = { ...job, ...(await post({ action: "arrived", code: document.getElementById("code").value, ...pos })) }; stopSharing(); render(); }
      catch (x) { document.getElementById("err").textContent = x.message; e.target.disabled = false; }
    };
  } else if (C && (d.stage === "to_pickup" || d.stage === "in_transit")) {
    startSharing();
    const pick = d.stage === "to_pickup", ph = d.photos || {};
    act.innerHTML = pick
      ? `<div class="live">📍 Sharing your location. At the pickup:</div>
        <label style="display:block"><input type="file" accept="image/*" capture="environment" id="pPick" style="display:none"><span class="btn light" role="button">📷 Photo of the item ${ph.pickup ? "✓" : "— required"}</span></label>
        <div class="mut" id="pBusy"></div>
        <div style="margin-top:10px"><b>Sender's code</b> <span class="mut">— ask the sender</span></div>
        <input id="code" inputmode="numeric" maxlength="4" placeholder="• • • •">
        <button class="btn teal" id="go" ${ph.pickup ? "" : "disabled"}>📦 Picked up</button><div class="err" id="err"></div>`
      : `<div class="live">📍 On the way to the drop — the sender and receiver can see you.</div>
        <label style="display:block"><input type="file" accept="image/*" capture="environment" id="pDrop" style="display:none"><span class="btn light" role="button">📷 Photo at delivery ${ph.delivery ? "✓" : "— required"}</span></label>
        <div class="mut" id="pBusy"></div>
        <div style="margin-top:10px"><b>Receiver's code</b> <span class="mut">— ask the person receiving it</span></div>
        <input id="code" inputmode="numeric" maxlength="4" placeholder="• • • •">
        <button class="btn teal" id="go" ${ph.delivery ? "" : "disabled"}>✅ Delivered</button><div class="err" id="err"></div>`;
    const f = act.querySelector(pick ? "#pPick" : "#pDrop");
    f.onchange = (e) => photo(pick ? "pickup" : "delivery", e.target.files[0]);
    act.querySelector("#go").onclick = async (e) => {
      e.target.disabled = true;
      try { const pos = await here(); job = { ...job, ...(await post({ action: pick ? "picked_up" : "delivered", code: document.getElementById("code").value, ...pos })) }; render(); }
      catch (x) { document.getElementById("err").textContent = x.message; e.target.disabled = false; }
    };
  } else if (d.quoteJob && ["visiting", "quoted"].includes(d.stage)) {
    stopSharing();
    const Q = d.quoteJob.quote;
    const rows = Q ? Q.items : [{ text: "", amount: "" }, { text: "", amount: "" }];
    act.innerHTML = `<b>${Q ? "Quote sent — you can update it" : "Write the quote"}</b>
      <div class="mut">Materials included. The customer sees this on their phone and pays ${Math.round(d.quoteJob.advancePct * 100)}% to book.</div>
      <label style="display:block"><input type="file" accept="image/*" capture="environment" id="pBefore" style="display:none"><span class="btn light" role="button">📷 Photo of the current state ${d.photos.before ? `✓ (${d.photos.before})` : ""}</span></label>
      <div id="qRows" style="margin-top:10px">${rows.map((r, i) => `<div style="display:flex;gap:6px;margin-top:6px"><input class="qt" placeholder="Work / material, e.g. Remove old tiles" value="${esc(r.text)}" style="flex:2;font-size:15px;letter-spacing:0;text-align:left;padding:10px;margin:0"><input class="qa" inputmode="numeric" placeholder="₹" value="${r.amount || ""}" style="flex:1;font-size:15px;letter-spacing:0;text-align:right;padding:10px;margin:0"></div>`).join("")}</div>
      <button class="btn light" id="qAdd">+ Add line</button>
      <div style="display:flex;gap:8px;margin-top:10px"><label style="flex:1" class="mut">Days of work<input id="qDays" inputmode="numeric" value="${Q ? Q.days : ""}" style="font-size:16px;letter-spacing:0;padding:10px"></label><label style="flex:1" class="mut">Can start<input id="qStart" type="date" value="${Q && Q.start ? Q.start.slice(0, 10) : ""}" style="font-size:15px;letter-spacing:0;padding:9px"></label></div>
      <textarea id="qNote" rows="2" placeholder="Note for the customer (optional)">${Q ? esc(Q.note || "") : ""}</textarea>
      <div class="mut" id="qTotal" style="margin-top:8px"></div>
      <button class="btn teal" id="qSend">${Q ? "Update quote" : "Send quote to customer"}</button><div class="err" id="err"></div>`;
    const total = () => { const t = [...act.querySelectorAll(".qa")].reduce((n, x) => n + (Number(x.value) || 0), 0); act.querySelector("#qTotal").textContent = t ? `Total ₹${t.toLocaleString("en-IN")}` : ""; };
    act.addEventListener("input", total); total();
    act.querySelector("#qAdd").onclick = () => { act.querySelector("#qRows").insertAdjacentHTML("beforeend", `<div style="display:flex;gap:6px;margin-top:6px"><input class="qt" placeholder="Work / material" style="flex:2;font-size:15px;letter-spacing:0;text-align:left;padding:10px;margin:0"><input class="qa" inputmode="numeric" placeholder="₹" style="flex:1;font-size:15px;letter-spacing:0;text-align:right;padding:10px;margin:0"></div>`); };
    act.querySelector("#pBefore").onchange = (e) => photo("before", e.target.files[0]);
    act.querySelector("#qSend").onclick = async (e) => {
      const items = [...act.querySelectorAll("#qRows > div")].map((r) => ({ text: r.querySelector(".qt").value, amount: Number(r.querySelector(".qa").value) || 0 }));
      e.target.disabled = true;
      try { job = { ...job, ...(await post({ action: "quote", items, days: act.querySelector("#qDays").value, start: act.querySelector("#qStart").value || null, note: act.querySelector("#qNote").value })) }; render(); }
      catch (x) { document.getElementById("err").textContent = x.message; e.target.disabled = false; }
    };
  } else if (d.quoteJob && d.stage === "awaiting_advance") {
    act.innerHTML = `<b>Customer accepted the quote 🎉</b><div class="mut">Waiting for their advance payment. You'll be told when you can start.</div>`;
  } else if (d.quoteJob && d.stage === "scheduled") {
    const Q = d.quoteJob.quote;
    act.innerHTML = `<b>Advance paid — job confirmed</b><div class="mut">${Q && Q.start ? `Planned start: ${new Date(Q.start).toLocaleDateString("en-IN", { day: "numeric", month: "short" })}. ` : ""}Tap when you start work on site.</div>
      <button class="btn teal" id="wStart">🔨 Start work</button><div class="err" id="err"></div>`;
    act.querySelector("#wStart").onclick = async (e) => { e.target.disabled = true; try { const pos = await here(); job = { ...job, ...(await post({ action: "work_started", ...pos })) }; render(); } catch (x) { document.getElementById("err").textContent = x.message; e.target.disabled = false; } };
  } else if (d.quoteJob && d.stage === "working") {
    act.innerHTML = `<b>Work in progress</b><div class="mut">Add a progress photo each day — the customer sees them.</div>
      <label style="display:block"><input type="file" accept="image/*" capture="environment" id="pProg" style="display:none"><span class="btn light" role="button">📷 Progress photo ${d.photos.progress ? `✓ (${d.photos.progress})` : ""}</span></label>
      <label style="display:block"><input type="file" accept="image/*" capture="environment" id="pAfter" style="display:none"><span class="btn light" role="button">📷 Finished work photo ${d.photos.after ? `✓ (${d.photos.after})` : "— needed to finish"}</span></label>
      <div class="mut" id="pBusy" style="margin-top:6px"></div>
      <textarea id="note" rows="2" placeholder="Note when finished (optional)"></textarea>
      <button class="btn" id="done" ${d.photos.after ? "" : "disabled"}>🏁 Work finished</button><div class="err" id="err"></div>`;
    act.querySelector("#pProg").onchange = (e) => photo("progress", e.target.files[0]);
    act.querySelector("#pAfter").onchange = (e) => photo("after", e.target.files[0]);
    act.querySelector("#done").onclick = async (e) => { e.target.disabled = true; try { job = { ...job, ...(await post({ action: "done", note: document.getElementById("note").value })) }; render(); } catch (x) { document.getElementById("err").textContent = x.message; e.target.disabled = false; } };
  } else if (d.stage === "arrived") {
    stopSharing();
    const ph = d.photos || { before: 0, after: 0 };
    act.innerHTML = `<b>Photos of the work</b><div class="mut">Customers see these. Take one before you start and one when you finish.</div>
      <label style="display:block"><input type="file" accept="image/*" capture="environment" id="pBefore" style="display:none"><span class="btn light" role="button">📷 Before photo ${ph.before ? `✓ (${ph.before})` : "(optional)"}</span></label>
      <label style="display:block"><input type="file" accept="image/*" capture="environment" id="pAfter" style="display:none"><span class="btn light" role="button">📷 After photo ${ph.after ? `✓ (${ph.after})` : "— required"}</span></label>
      <div class="mut" id="pBusy" style="margin-top:6px"></div>
      <div style="margin-top:14px"><b>When the work is finished</b></div><div class="mut">Anything WeAid should know? (optional)</div>
      <textarea id="note" rows="3" placeholder="e.g. replaced the tap washer, customer happy"></textarea>
      <button class="btn" id="done" ${ph.after ? "" : "disabled"}>🏁 Job done</button>
      ${ph.after ? "" : `<div class="mut" style="margin-top:6px">Add an after photo to finish.</div>`}<div class="err" id="err"></div>`;
    const send = async (kind, file) => {
      if (!file) return;
      document.getElementById("pBusy").textContent = "Uploading…";
      try {
        const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
        const sc = Math.min(1, 1600 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
        c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        job = { ...job, ...(await post({ action: "photo", kind, mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.82) })) };
        render();
      } catch (x) { document.getElementById("pBusy").textContent = ""; document.getElementById("err").textContent = x.message || "Couldn't upload. Try again."; }
    };
    act.querySelector("#pBefore").onchange = (e) => send("before", e.target.files[0]);
    act.querySelector("#pAfter").onchange = (e) => send("after", e.target.files[0]);
    act.querySelector("#done").onclick = async (e) => {
      e.target.disabled = true;
      try { job = { ...job, ...(await post({ action: "done", note: document.getElementById("note").value })) }; render(); }
      catch (x) { document.getElementById("err").textContent = x.message; e.target.disabled = false; }
    };
  } else {
    stopSharing();
    act.innerHTML = d.stage === "done" ? `<h1>🎉 Thank you!</h1><div class="mut">This job is complete. WeAid will settle your payment.</div>
      <div style="margin-top:14px;text-align:center"><b>Ask the customer for a Google review</b><div class="mut">Show them this — they scan it with their phone camera. Every customer, happy or not: it's how new families find WeAid.</div>
      <img alt="QR code" style="margin-top:10px;width:200px;height:200px" src="https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=${encodeURIComponent("https://weaid.in/review")}"><div class="mut">weaid.in/review</div></div>` : `<div class="mut">This job is ${esc(d.words.toLowerCase())}.</div>`;
  }
}

(async () => {
  try { const r = await fetch(API); job = await r.json(); if (!r.ok) throw 0; render(); }
  catch { document.getElementById("head").innerHTML = "<h1>Job not found</h1><div class='mut'>Please use the link WeAid sent you.</div>"; }
})();
</script>
</body>
</html>
