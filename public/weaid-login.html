<style>
:root {
  --bg: #07090f; --bg2: #0e1117; --bg3: #161b27;
  --border: rgba(255,255,255,0.08); --teal: #00c9b1; --gold: #f0b429;
  --indigo: #6366f1; --text: #e8eef8; --muted: #6b7a99; --white: #ffffff;
  --red: #ef4444; --green: #22c55e;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:'Sora',sans-serif; background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }

.bg-glow { position:fixed; inset:0; pointer-events:none; }
.glow-1 { position:absolute; top:-20%; left:-10%; width:600px; height:600px; background:radial-gradient(circle, rgba(99,102,241,0.08), transparent 70%); }
.glow-2 { position:absolute; bottom:-20%; right:-10%; width:500px; height:500px; background:radial-gradient(circle, rgba(0,201,177,0.07), transparent 70%); }

.login-wrap { position:relative; z-index:10; width:100%; max-width:460px; padding:24px; }

.logo-center { text-align:center; margin-bottom:36px; }
.logo-mark-lg { width:140px; height:82px; background:url("/weaid-mark.png") center/contain no-repeat; margin:0 auto 16px; transform-origin:center 70%; animation:handshake 1.25s cubic-bezier(.2,.8,.2,1) both; }
.logo-name { font-family:'Sora',sans-serif; font-size:2.1rem; font-weight:800; letter-spacing:-0.03em; color:#0F5044; }
.logo-name span { color:#F5851F; }
.logo-tag { font-size:0.72rem; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#0F5044; margin-top:9px; display:flex; align-items:center; justify-content:center; gap:11px; }
.logo-tag::before, .logo-tag::after { content:""; width:22px; height:2px; background:#0F5044; opacity:.45; border-radius:2px; }
@keyframes handshake {
  0%   { opacity:0; transform:scale(.55) translateY(8px); }
  45%  { opacity:1; transform:scale(1.07); }
  60%  { transform:scale(1) rotate(-6deg); }
  73%  { transform:rotate(4.5deg); }
  85%  { transform:rotate(-2.5deg); }
  100% { transform:rotate(0) scale(1); }
}
@media (prefers-reduced-motion:reduce){ .logo-mark-lg{ animation:none; } }

.login-card { background:var(--bg2); border:1px solid var(--border); border-radius:20px; padding:36px; }
.card-title { font-family:'Playfair Display',serif; font-size:1.4rem; font-weight:700; margin-bottom:6px; }
.card-sub { font-size:0.82rem; color:var(--muted); margin-bottom:28px; }

.form-field { margin-bottom:18px; }
.form-field label { display:block; font-size:0.7rem; font-weight:600; color:var(--muted); letter-spacing:0.5px; text-transform:uppercase; margin-bottom:8px; }
.form-field input { width:100%; padding:13px 16px; background:var(--bg3); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-family:'Sora',sans-serif; font-size:0.88rem; outline:none; transition:border-color 0.2s; }
.form-field input:focus { border-color:var(--teal); }
.form-field input::placeholder { color:var(--muted); }

.phone-row { display:flex; gap:8px; }
.country-code { flex:0 0 72px; width:72px; padding:13px 12px; background:var(--bg3); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-family:'Sora',sans-serif; font-size:0.88rem; text-align:center; outline:none; }
.phone-input { flex:1; min-width:0; padding:14px 16px; background:var(--bg3); border:1.5px solid var(--border); border-radius:10px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:1rem; outline:none; transition:border-color 0.2s; }
.phone-input:focus { border-color:var(--teal); }

/* OTP Input */
.otp-row { display:flex; gap:8px; justify-content:center; margin:20px 0; }
.otp-digit { width:48px; height:56px; background:var(--bg3); border:1.5px solid var(--border); border-radius:10px; color:var(--white); font-family:'Sora',sans-serif; font-size:1.4rem; font-weight:700; text-align:center; outline:none; transition:border-color 0.2s; }
.otp-digit:focus { border-color:var(--teal); }

/* Buttons */
.login-btn { width:100%; padding:14px; border:none; border-radius:12px; font-family:'Sora',sans-serif; font-size:0.95rem; font-weight:700; cursor:pointer; transition:all 0.2s; background:var(--teal); color:#fff; }
.login-btn:hover { transform:translateY(-1px); box-shadow:0 8px 24px rgba(0,201,177,0.3); }
.login-btn:disabled { opacity:0.5; cursor:not-allowed; transform:none; box-shadow:none; }

/* Role Selection */
.role-cards { display:flex; gap:12px; margin:20px 0; }
.role-card { flex:1; padding:20px 16px; background:var(--bg3); border:2px solid var(--border); border-radius:14px; text-align:center; cursor:pointer; transition:all 0.2s; }
.role-card:hover { border-color:var(--muted); }
.role-card.selected { border-color:var(--teal); background:rgba(0,201,177,0.08); }
.role-card .rc-icon { font-size:1.8rem; margin-bottom:8px; }
.role-card .rc-name { font-size:0.88rem; font-weight:700; margin-bottom:4px; }
.role-card .rc-desc { font-size:0.72rem; color:var(--muted); }

/* Timer & Resend */
.timer-row { text-align:center; margin-top:16px; font-size:0.8rem; color:var(--muted); }
.resend-btn { background:none; border:none; color:var(--teal); font-family:inherit; font-size:0.8rem; font-weight:600; cursor:pointer; padding:0; }
.resend-btn:disabled { color:var(--muted); cursor:not-allowed; }

/* Error/Success */
.msg { padding:10px 14px; border-radius:8px; font-size:0.8rem; margin-bottom:16px; display:none; }
.msg.error { background:rgba(239,68,68,0.1); border:1px solid rgba(239,68,68,0.2); color:var(--red); display:block; }
.msg.success { background:rgba(34,197,94,0.1); border:1px solid rgba(34,197,94,0.2); color:var(--green); display:block; }

/* Steps */
.step { display:none; }
.step.active { display:block; }

.back-home { text-align:center; margin-top:20px; }
.back-home a { font-size:0.78rem; color:var(--muted); text-decoration:none; }
.back-home a:hover { color:var(--teal); }

.change-phone { text-align:center; margin-top:12px; }
.change-phone a { font-size:0.78rem; color:var(--teal); text-decoration:none; cursor:pointer; }

@media(max-width:500px){
  .login-wrap { padding:16px; }
  .otp-digit { width:42px; height:50px; font-size:1.2rem; }
  .role-cards { flex-direction:column; }
}
</style>

<style>
/* Daylight — light-theme override */
:root{--bg:#FFFFFF;--bg2:#FFFFFF;--bg3:#F1F3F6;--border:#E7E9EF;--teal:#1A6E5E;--gold:#B7791F;--text:#14171F;--muted:#565D6D;--white:#14171F;}
.email-input{width:100%;padding:14px 16px;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:1rem;outline:none;transition:border-color 0.2s;}
.email-input:focus{border-color:var(--teal);}
.code-input{width:100%;padding:16px;margin:20px 0;background:var(--bg3);border:1.5px solid var(--border);border-radius:12px;color:var(--text);font-family:'Sora',sans-serif;font-size:1.6rem;font-weight:700;text-align:center;letter-spacing:8px;outline:none;transition:border-color 0.2s;}
.code-input:focus{border-color:var(--teal);}
.code-input::placeholder{letter-spacing:normal;font-size:1rem;font-weight:400;color:var(--muted);}
.or-divider{display:flex;align-items:center;gap:12px;margin:16px 0;color:var(--muted);font-size:0.8rem;}
.or-divider::before,.or-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.google-btn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff !important;color:#14171F !important;border:1.5px solid var(--border);}
.google-btn svg{width:18px;height:18px;}
</style>
</head>
<body>
<div class="bg-glow"><div class="glow-1"></div><div class="glow-2"></div></div>

<div class="login-wrap">
  <div class="logo-center">
    <div class="logo-mark-lg"></div>
    <div class="logo-name">weaid<span>.in</span></div>
    <div class="logo-tag">Any Service, Anytime</div>
  </div>

  <div class="login-card">
    <!-- STEP 1: Email -->
    <div class="step active" id="step1">
      <div class="card-title">Sign in</div>
      <div class="card-sub">We'll email you a login code</div>
      <div id="msg1" class="msg"></div>
      <div class="form-field">
        <label>Email</label>
        <input type="email" class="email-input" id="emailInput" placeholder="you@email.com" autocomplete="email" autofocus>
      </div>
      <button class="login-btn" id="sendOtpBtn" onclick="sendOTP()">Send code →</button>
      <div class="or-divider"><span>or</span></div>
      <button class="login-btn google-btn" id="googleBtn" onclick="signInGoogle()">
        <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.84 14.1a6.6 6.6 0 0 1 0-4.2V7.06H2.18a11 11 0 0 0 0 9.88l3.66-2.84z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84C6.71 7.31 9.14 5.38 12 5.38z"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- STEP 2: OTP Verification -->
    <div class="step" id="step2">
      <div class="card-title">Enter code</div>
      <div class="card-sub">Sent to <strong id="otpPhoneDisplay">your email</strong></div>
      <div id="msg2" class="msg"></div>
      <input type="text" class="code-input" id="otpInput" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="Enter the code">

      <button class="login-btn" id="verifyBtn" onclick="verifyOTP()">Verify & Sign In →</button>
      <div class="timer-row" id="timerRow">
        Resend OTP in <span id="countdown">30</span>s
      </div>
      <div class="timer-row" id="resendRow" style="display:none;">
        <button class="resend-btn" onclick="sendOTP()">Resend OTP</button>
      </div>
      <div class="change-phone"><a onclick="goStep(1)">← Change email</a></div>
    </div>

    <!-- STEP 3: Role Selection (new users) -->
    <div class="step" id="step3">
      <div class="card-title">Almost there!</div>
      <div class="card-sub">How will you use WeAid?</div>
      <div id="msg3" class="msg"></div>
      <div class="form-field">
        <label>Your Name</label>
        <input type="text" id="nameInput" placeholder="Enter your full name">
      </div>
      <div class="form-field">
        <label>Phone Number</label>
        <div class="phone-row">
          <input type="text" class="country-code" value="+91" readonly>
          <input type="tel" class="phone-input" id="phoneInput" placeholder="9876543210" maxlength="10">
        </div>
      </div>
      <div class="role-cards">
        <div class="role-card selected" onclick="selectRole('customer',this)">
          <div class="rc-icon">👤</div>
          <div class="rc-name">Customer</div>
          <div class="rc-desc">Book home services</div>
        </div>
        <div class="role-card" onclick="selectRole('provider',this)">
          <div class="rc-icon">🔨</div>
          <div class="rc-name">Provider</div>
          <div class="rc-desc">Offer your services</div>
        </div>
      </div>
      <button class="login-btn" onclick="setRole()">Get Started →</button>
    </div>
  </div>

  <div class="back-home">
    <a href="/">← Back to WeAid.in</a>
  </div>
</div>

<script>
let sb = null;
let currentEmail = '';
let selectedRole = 'customer';
let countdownTimer = null;

// Initialize Supabase client from /api/config
async function initSupabase() {
  try {
    const res = await fetch('/api/config');
    const config = await res.json();
    if (!config.supabaseUrl || !config.supabaseAnonKey) {
      console.warn('Supabase not configured. Add NEXT_PUBLIC_SUPABASE_ANON_KEY to Vercel.');
      return false;
    }
    sb = window.supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);
    return true;
  } catch (e) {
    console.warn('Failed to load config:', e);
    return false;
  }
}

// Step navigation
function goStep(n) {
  document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
  document.getElementById('step' + n).classList.add('active');
}

function showMsg(stepNum, text, type) {
  const el = document.getElementById('msg' + stepNum);
  el.textContent = text;
  el.className = 'msg ' + type;
  setTimeout(() => { el.className = 'msg'; }, 5000);
}

// Sign in with Google (redirects to Google, returns to /login)
async function signInGoogle() {
  if (!sb) { showMsg(1, 'Auth not configured yet. Try email, or contact admin.', 'error'); return; }
  const { error } = await sb.auth.signInWithOAuth({
    provider: 'google',
    options: { redirectTo: window.location.origin + '/login' },
  });
  if (error) showMsg(1, error.message || 'Google sign-in failed', 'error');
}

// STEP 1: Send email code
async function sendOTP() {
  const email = document.getElementById('emailInput').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    showMsg(1, 'Please enter a valid email address', 'error');
    return;
  }

  currentEmail = email;
  const btn = document.getElementById('sendOtpBtn');
  btn.disabled = true;
  btn.textContent = 'Sending...';

  if (!sb) {
    // Fallback: demo mode if Supabase not configured
    showMsg(1, 'Auth not configured. Contact admin to set up Supabase Auth.', 'error');
    btn.disabled = false;
    btn.textContent = 'Send code →';
    return;
  }

  try {
    const { error } = await sb.auth.signInWithOtp({ email: currentEmail });
    if (error) {
      showMsg(1, error.message || 'Failed to send code', 'error');
      btn.disabled = false;
      btn.textContent = 'Send code →';
      return;
    }

    // Move to code step
    document.getElementById('otpPhoneDisplay').textContent = currentEmail;
    goStep(2);
    startCountdown();
    const inp=document.getElementById('otpInput');inp.value='';inp.focus();
  } catch (e) {
    showMsg(1, 'Connection error. Please try again.', 'error');
  }

  btn.disabled = false;
  btn.textContent = 'Send code →';
}

// STEP 2: Verify OTP
async function verifyOTP() {
  const token = (document.getElementById('otpInput').value || '').replace(/\D/g, '');
  if (token.length < 4) {
    showMsg(2, 'Please enter the code from your email', 'error');
    return;
  }

  const btn = document.getElementById('verifyBtn');
  btn.disabled = true;
  btn.textContent = 'Verifying...';

  try {
    const { data, error } = await sb.auth.verifyOtp({
      email: currentEmail,
      token,
      type: 'email',
    });

    if (error) {
      showMsg(2, error.message || 'Invalid OTP. Please try again.', 'error');
      btn.disabled = false;
      btn.textContent = 'Verify & Sign In →';
      return;
    }

    // Check if user has a role set
    const session = data.session;
    const res = await fetch('/api/auth/me', {
      headers: { 'Authorization': 'Bearer ' + session.access_token },
    });
    const user = await res.json();

    if (user.isNewUser || !user.role) {
      // New user — show role selection
      goStep(3);
    } else {
      // Existing user — redirect to dashboard
      redirectToDashboard(user.role);
    }
  } catch (e) {
    showMsg(2, 'Verification failed. Please try again.', 'error');
  }

  btn.disabled = false;
  btn.textContent = 'Verify & Sign In →';
}

// STEP 3: Set Role
function selectRole(role, el) {
  selectedRole = role;
  document.querySelectorAll('.role-card').forEach(c => c.classList.remove('selected'));
  el.classList.add('selected');
}

async function setRole() {
  const name = document.getElementById('nameInput').value.trim();
  const phone = document.getElementById('phoneInput').value.replace(/\D/g, '');
  if (!name) {
    showMsg(3, 'Please enter your name', 'error');
    return;
  }
  if (phone.length !== 10) {
    showMsg(3, 'Please enter a valid 10-digit phone number', 'error');
    return;
  }

  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) {
      showMsg(3, 'Session expired. Please start over.', 'error');
      goStep(1);
      return;
    }

    const res = await fetch('/api/auth/set-role', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token,
      },
      body: JSON.stringify({ role: selectedRole, name, phone: '+91' + phone }),
    });

    const data = await res.json();
    if (!res.ok) {
      showMsg(3, data.error || 'Failed to set role', 'error');
      return;
    }

    redirectToDashboard(selectedRole);
  } catch (e) {
    showMsg(3, 'Connection error. Please try again.', 'error');
  }
}

function redirectToDashboard(role) {
  if (role === 'provider') window.location.href = '/provider';
  else if (role === 'admin') window.location.href = '/admin';
  else window.location.href = '/dashboard';
}

// Code input: Enter to submit
document.getElementById('otpInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') verifyOTP();
});

// Enter key on email input
document.getElementById('emailInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') sendOTP();
});

// Countdown timer
function startCountdown() {
  let sec = 30;
  document.getElementById('timerRow').style.display = 'block';
  document.getElementById('resendRow').style.display = 'none';
  document.getElementById('countdown').textContent = sec;

  clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    sec--;
    document.getElementById('countdown').textContent = sec;
    if (sec <= 0) {
      clearInterval(countdownTimer);
      document.getElementById('timerRow').style.display = 'none';
      document.getElementById('resendRow').style.display = 'block';
    }
  }, 1000);
}

// Check if already logged in (also handles return from Google OAuth)
async function checkSession() {
  if (!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    try {
      const res = await fetch('/api/auth/me', {
        headers: { 'Authorization': 'Bearer ' + session.access_token },
      });
      const user = await res.json();
      if (user.role) {
        redirectToDashboard(user.role);
      } else {
        // Signed in (e.g. via Google) but no role yet — pick one.
        const gname = session.user?.user_metadata?.full_name || session.user?.user_metadata?.name || '';
        if (gname) document.getElementById('nameInput').value = gname;
        goStep(3);
      }
    } catch (e) {}
  }
}

// Init
initSupabase().then(ok => { if (ok) checkSession(); });
</script>
