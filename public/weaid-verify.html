<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Verify your identity — WeAid Pro</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0f14;--mut:#5b6573;--line:#e7ebf0;--bg:#f6f8fa;--teal:#0d9488;--teal-d:#0f766e;--red:#b91c1c;--amber:#b45309}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5}
main{max-width:520px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:24px;margin:6px 0 4px}.mut{color:var(--mut);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.step{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pill{font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#eef2f6;white-space:nowrap}
.pill.ok{background:#dcfce7;color:#166534}.pill.redo{background:#fee2e2;color:var(--red)}.pill.wait{background:#fef3c7;color:var(--amber)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chips button{font:inherit;font-size:14px;font-weight:700;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff}
.chips button.on{background:#f0fdfa;border-color:var(--teal);color:var(--teal-d)}
.btn{display:block;width:100%;text-align:center;font:inherit;font-weight:800;font-size:17px;padding:14px;border-radius:14px;border:0;background:var(--teal);color:#fff;margin-top:12px;cursor:pointer}
.btn.light{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn:disabled{opacity:.6}
.msg{border-radius:12px;padding:10px 12px;font-size:14px;margin-top:10px}
.msg.redo{background:#fef2f2;color:var(--red)}.msg.info{background:#f0fdfa;color:var(--teal-d)}
.example{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:14px}
.example span{font-size:34px}
input[type=file]{display:none}
.big{font-size:40px;text-align:center}
</style>
</head>
<body><div style="background:#fff;border-bottom:1px solid #e7ebf0"><div style="max-width:520px;margin:0 auto;padding:12px 16px;font-weight:800;font-size:20px"><img src="/icon-192.png" alt="" style="width:30px;height:30px;vertical-align:middle;margin-right:6px;border-radius:7px">We<b style="color:#f97316">Aid</b> <span style="font-size:13px;color:#5b6573">Pro</span></div></div><main>
  <div id="app"><div class="mut">Loading…</div></div>
</main>
<script>
const TOKEN = new URLSearchParams(location.hash.slice(1)).get("t") || "";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const TYPES = [["driving_licence", "Driving licence"], ["voter_id", "Voter ID"], ["pan", "PAN card"], ["masked_aadhaar", "Masked Aadhaar"], ["passport", "Passport"]];
let st = null, idType = "driving_licence", busy = "";

async function api(body) {
  const r = await fetch("/api/pro/verify", { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", "X-Pro-Token": TOKEN }, body: body ? JSON.stringify(body) : undefined });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "Something went wrong. Please try again.");
  return d;
}

/* Phone photos are 3–6 MB; shrink to ~300 KB before sending. */
function shrink(file) {
  return new Promise((res, rej) => {
    if (file.type === "application/pdf") {
      if (file.size > 4_000_000) return rej(new Error("That PDF is too big (max 4 MB)."));
      const fr = new FileReader(); fr.onload = () => res({ mime: "application/pdf", data: fr.result }); fr.onerror = rej; fr.readAsDataURL(file); return;
    }
    const img = new Image();
    img.onload = () => {
      const max = 1600, s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      res({ mime: "image/jpeg", data: c.toDataURL("image/jpeg", 0.85) });
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => rej(new Error("Couldn't read that photo. Please try another."));
    img.src = URL.createObjectURL(file);
  });
}

async function upload(step, file) {
  if (!file) return;
  busy = step; render();
  try {
    const { mime, data } = await shrink(file);
    st = { ...st, ...(await api({ step, mime, data, idType })) };
  } catch (e) { alert(e.message); }
  busy = ""; render();
}

function pill(s) {
  if (!s) return '<span class="pill">Not done</span>';
  return s.verdict === "redo" ? '<span class="pill redo">Please redo</span>' : s.verdict === "ok" ? '<span class="pill ok">Looks good ✓</span>' : '<span class="pill wait">Sent for review</span>';
}

function render() {
  const app = document.getElementById("app");
  if (!TOKEN) { app.innerHTML = "<h1>Please open this from the WeAid Pro app.</h1>"; return; }
  if (!st) return;
  if (st.state === "approved") { app.innerHTML = `<div class="card" style="text-align:center"><div class="big">✅</div><h1>You're verified</h1><div class="mut">Go back to the app and switch Online to get jobs.</div></div>`; return; }
  if (st.state === "rejected") { app.innerHTML = `<div class="card"><h1>Not approved</h1><div class="msg redo">${esc(st.note)}</div><div class="mut" style="margin-top:10px">Questions? Call WeAid on <a href="tel:+918064267771">080 6426 7771</a>.</div></div>`; return; }

  const waiting = st.state === "review" || st.state === "call";
  app.innerHTML = `
    <h1>Verify your identity</h1>
    <div class="mut">WeAid pros go into customers' homes, so we check everyone first. It takes 3 minutes. WeAid keeps a private copy of your ID while you work with us, so we know who visited each customer. It is never shown to customers.</div>
    ${st.state === "call" ? `<div class="msg info">📹 ${esc(st.note)}</div>` : waiting ? `<div class="msg info">✓ Thanks! WeAid is checking your details — usually within a day. You can add your police certificate below meanwhile.</div>` : ""}

    <div class="card">
      <div class="step"><b>1. Your photo</b>${pill(st.photo)}</div>
      <div class="example"><span>🙂</span><div class="mut">A clear photo of your face — customers see it before you arrive, so they know it's you at the door. No sunglasses or helmet.</div></div>
      ${st.photo && st.photo.verdict !== "ok" && st.photo.message ? `<div class="msg ${st.photo.verdict === "redo" ? "redo" : "info"}">${esc(st.photo.message)}</div>` : ""}
      <label><input type="file" id="photoFile" accept="image/*" capture="user"><span class="btn" role="button">${busy === "photo" ? "Checking your photo…" : st.photo ? "📷 Retake photo" : "📷 Take photo"}</span></label>
    </div>

    <div class="card">
      <div class="step"><b>2. Selfie holding your ID</b>${pill(st.id)}</div>
      <div class="example"><span>🤳🪪</span><div class="mut">Hold your ID next to your face. Both your face and the card must be clear — good light, no fingers over the card.</div></div>
      <div class="mut" style="margin-top:10px">Which ID?</div>
      <div class="chips" id="types">${TYPES.map(([k, v]) => `<button data-k="${k}" class="${k === idType ? "on" : ""}">${v}</button>`).join("")}</div>
      <div class="mut" style="margin-top:8px;font-size:13px"><b>Drivers:</b> use your driving licence. Aadhaar: only the <b>masked</b> version (last 4 digits) — download it free at myaadhaar.uidai.gov.in. Please don't send your full Aadhaar.</div>
      ${st.id && st.id.verdict !== "ok" && st.id.message ? `<div class="msg ${st.id.verdict === "redo" ? "redo" : "info"}">${esc(st.id.message)}</div>` : ""}
      <label><input type="file" id="idFile" accept="image/*" capture="user"><span class="btn" role="button">${busy === "id" ? "Checking your photo…" : st.id ? "📷 Retake photo" : "📷 Take photo"}</span></label>
      <label><input type="file" id="idGallery" accept="image/*"><span class="btn light" role="button">Choose from gallery</span></label>
    </div>

    <div class="card">
      <div class="step"><b>3. Police clearance certificate</b>${pill(st.pcc)}</div>
      <div class="mut" style="margin-top:6px">Recommended — pros with one get a <b>Police-verified</b> badge customers trust. Apply online at <b>thuna.keralapolice.gov.in</b> → Police Clearance Certificate. Upload the PDF or a photo when you get it.</div>
      ${st.pcc && st.pcc.verdict !== "ok" && st.pcc.message ? `<div class="msg ${st.pcc.verdict === "redo" ? "redo" : "info"}">${esc(st.pcc.message)}</div>` : ""}
      <label><input type="file" id="pccFile" accept="image/*,application/pdf"><span class="btn light" role="button">${busy === "pcc" ? "Checking your certificate…" : st.pcc ? "Upload again" : "Upload certificate"}</span></label>
    </div>
    <div class="mut" style="margin-top:14px">Questions? Call WeAid on <a href="tel:+918064267771">080 6426 7771</a>.</div>`;

  app.querySelectorAll("#types button").forEach((b) => (b.onclick = () => { idType = b.dataset.k; render(); }));
  app.querySelectorAll("input[type=file]").forEach((i) => { if (busy) i.disabled = true; });
  document.getElementById("photoFile").onchange = (e) => upload("photo", e.target.files[0]);
  document.getElementById("idFile").onchange = (e) => upload("id", e.target.files[0]);
  document.getElementById("idGallery").onchange = (e) => upload("id", e.target.files[0]);
  document.getElementById("pccFile").onchange = (e) => upload("pcc", e.target.files[0]);
}

(async () => {
  try { st = await api(); render(); }
  catch (e) { document.getElementById("app").innerHTML = `<h1>Couldn't load</h1><div class="mut">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
