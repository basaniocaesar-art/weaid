<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Carpool — WeAid</title>
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#1A6E5E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/weaid-theme.css">
<style>
.wrap{max-width:620px;margin:0 auto;padding:26px 20px 60px}
.h1{font-size:30px;margin-bottom:4px}
.sub{color:var(--t2);font-size:15px;margin-bottom:18px}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tab{flex:1;text-align:center;padding:12px;border-radius:12px;background:var(--bg-soft);font-weight:700;cursor:pointer;font-size:0.95rem}
.tab.on{background:var(--ink);color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;font-weight:700;margin:0 0 6px 2px}
.field input,.field textarea{width:100%;padding:13px 14px;background:var(--bg-soft);border:1.5px solid transparent;border-radius:11px;font-family:inherit;font-size:16px;color:var(--text);outline:none}
.field input:focus,.field textarea:focus{background:#fff;border-color:var(--ink)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ride{background:var(--surface);border:1px solid var(--bdr);border-radius:16px;padding:18px;margin-bottom:12px;box-shadow:var(--shadow-sm)}
.ride .route{font-weight:700;font-size:16px;color:var(--ink)}
.ride .meta{font-size:13px;color:var(--t2);margin-top:4px}
.ride .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.ride .price{font-size:20px;font-weight:800;color:var(--ink)}
.ride .seats{font-size:12px;color:var(--teal-text);font-weight:700}
.empty{text-align:center;color:var(--t2);padding:40px 0}
.msg{font-size:13px;margin-top:8px}
</style>
</head>
<body>
<nav class="nav" id="nav">
  <a href="/" class="logo"><div class="lm">W</div><div class="lt">weaid<span>.in</span></div></a>
  <div class="nav-right"><a href="/ride" class="nav-link">Book a ride</a></div>
</nav>

<div class="wrap">
  <h1 class="h1">Carpool</h1>
  <p class="sub">Going somewhere? Offer a seat and split the cost — or find a ride heading your way.</p>

  <div class="tabs">
    <div class="tab on" id="tabFind" onclick="showTab('find')">🔎 Find a ride</div>
    <div class="tab" id="tabOffer" onclick="showTab('offer')">🚗 Offer a ride</div>
  </div>

  <div id="find">
    <div class="field"><input id="fTo" placeholder="Where are you going? (e.g. Kochi)" oninput="loadRides()"></div>
    <div id="rides"><div class="empty">Loading rides…</div></div>
  </div>

  <div id="offer" style="display:none">
    <div class="field"><label>From</label><input id="oFrom" placeholder="Starting point"></div>
    <div class="field"><label>To</label><input id="oTo" placeholder="Destination"></div>
    <div class="row2">
      <div class="field"><label>When</label><input id="oWhen" type="datetime-local"></div>
      <div class="field"><label>Seats</label><input id="oSeats" type="number" min="1" max="6" value="3"></div>
    </div>
    <div class="field"><label>Price per seat (₹)</label><input id="oPrice" type="number" min="0" placeholder="e.g. 150"></div>
    <div class="field"><label>Your name</label><input id="oName" placeholder="Name"></div>
    <div class="field"><label>Phone</label><input id="oPhone" type="tel" placeholder="Phone"></div>
    <div class="field"><label>Notes</label><textarea id="oNotes" placeholder="Car model, luggage space, timing flexibility…"></textarea></div>
    <button class="btn btn-primary btn-block" onclick="postRide(this)">Post my ride</button>
    <div class="msg" id="offerMsg"></div>
  </div>
</div>

<script>
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function showTab(t){document.getElementById('find').style.display=t==='find'?'block':'none';document.getElementById('offer').style.display=t==='offer'?'block':'none';document.getElementById('tabFind').classList.toggle('on',t==='find');document.getElementById('tabOffer').classList.toggle('on',t==='offer');}
let ridesTimer=null;
function loadRides(){clearTimeout(ridesTimer);ridesTimer=setTimeout(_loadRides,300);}
async function _loadRides(){
  const to=document.getElementById('fTo').value.trim();
  try{
    const r=await fetch('/api/carpool'+(to?('?to='+encodeURIComponent(to)):''));const d=await r.json();
    const list=d.carpools||[];
    document.getElementById('rides').innerHTML=list.length?list.map(c=>{
      const when=c.depart_at?new Date(c.depart_at).toLocaleString('en-IN',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Flexible';
      return `<div class="ride"><div class="route">${esc(c.from_address)} → ${esc(c.to_address)}</div><div class="meta">${when}${c.notes?' · '+esc(c.notes):''}</div><div class="foot"><div><div class="price">₹${c.price_per_seat}<span style="font-size:12px;color:var(--t2);font-weight:500"> /seat</span></div><div class="seats">${c.seats_left} seat(s) left</div></div><button class="btn btn-primary btn-sm" onclick="join('${c.id}',this)">Join</button></div></div>`;
    }).join(''):'<div class="empty">No rides posted for this route yet. Be the first to offer one!</div>';
  }catch(e){document.getElementById('rides').innerHTML='<div class="empty">Couldn’t load rides.</div>';}
}
async function join(id,btn){
  const name=prompt('Your name?');if(!name)return;const phone=prompt('Your phone number?');if(!phone)return;
  btn.disabled=true;btn.textContent='…';
  try{const r=await fetch('/api/carpool',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'join',carpoolId:id,rider:{name,phone}})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Failed');
    alert('You’re in! The driver has your number and will coordinate pickup. Contact: '+(d.driverContact||''));loadRides();
  }catch(e){btn.disabled=false;btn.textContent='Join';alert(e.message);}
}
async function postRide(btn){
  const msg=document.getElementById('offerMsg');
  const v=id=>document.getElementById(id).value.trim();
  if(!v('oFrom')||!v('oTo')||!v('oName')||v('oPhone').replace(/[^0-9]/g,'').length<10){msg.style.color='var(--error)';msg.textContent='Fill from, to, name and a valid phone.';return;}
  btn.disabled=true;btn.textContent='Posting…';
  try{
    const r=await fetch('/api/carpool',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'create',
      driver:{name:v('oName'),phone:v('oPhone')},from:{address:v('oFrom')},to:{address:v('oTo')},departAt:v('oWhen')||null,seats:v('oSeats')||3,pricePerSeat:v('oPrice')||0,notes:v('oNotes')||null})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Failed');
    msg.style.color='var(--success)';msg.textContent='Posted! Riders heading your way can now join.';btn.disabled=false;btn.textContent='Post my ride';
    setTimeout(()=>showTab('find'),900);loadRides();
  }catch(e){btn.disabled=false;btn.textContent='Post my ride';msg.style.color='var(--error)';msg.textContent=e.message;}
}
addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('scrolled',scrollY>8));
_loadRides();
</script>
</body>
</html>
