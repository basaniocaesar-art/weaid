<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Carpool — WeAid</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#0b0f14;--mut:#5b6573;--line:#e7ebf0;--bg:#f6f8fa;--teal:#0d9488;--teal-d:#0f766e;--orange:#f97316;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5}
.top{background:#fff;border-bottom:1px solid var(--line)}.top div{max-width:560px;margin:0 auto;padding:12px 16px;font-weight:800;font-size:20px}.top b{color:var(--orange)}.top a{text-decoration:none;color:inherit}
main{max-width:560px;margin:0 auto;padding:16px 16px 60px}
h1{font-size:26px;margin:6px 0 4px}.mut{color:var(--mut);font-size:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
label{display:block;font-size:13px;font-weight:700;margin-top:10px}
input,select{display:block;width:100%;font:inherit;font-size:16px;padding:12px;border-radius:12px;border:1.5px solid var(--line);margin-top:4px;background:#fff}
.btn{display:block;width:100%;text-align:center;font:inherit;font-weight:800;font-size:17px;padding:14px;border-radius:14px;border:0;background:linear-gradient(90deg,var(--teal),var(--orange));color:#fff;margin-top:12px;cursor:pointer;text-decoration:none}
.btn.light{background:#fff;color:var(--ink);border:1.5px solid var(--line)}.btn.red{background:#fff;color:var(--red);border:1.5px solid var(--line)}
.btn:disabled{opacity:.6}
.ride{display:flex;gap:12px;align-items:flex-start}
.ride img,.ride .ph{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#e7ebf0;flex:none}
.price{font-size:22px;font-weight:800;color:var(--teal-d)}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:#ccfbf1;color:var(--teal-d);margin-right:4px}
.code{font-size:44px;font-weight:800;letter-spacing:.3em;text-align:center;color:var(--teal-d)}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:15px}.row:last-child{border:0}
.err{color:var(--red);font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="top"><div><a href="/"><img src="/icon-192.png" alt="" style="width:30px;height:30px;vertical-align:middle;margin-right:6px;border-radius:7px">We<b>Aid</b></a> <span class="mut" style="font-weight:600">· Carpool</span></div></div>
<main id="app"></main>
<script src="/carpool-places.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = (iso) => new Date(iso).toLocaleString("en-IN", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" });
const inr = (n) => "₹" + Number(n || 0).toLocaleString("en-IN");
const q = new URLSearchParams(location.search);
const app = document.getElementById("app");
async function api(body) {
  const r = await fetch("/api/carpool", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error || "Something went wrong."); return d;
}

/* ---------- booking page ---------- */
async function showSeat() {
  const S = q.get("s"), K = q.get("k");
  const r = await fetch(`/api/carpool?s=${encodeURIComponent(S)}&k=${encodeURIComponent(K)}`);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) { app.innerHTML = "<h1>Booking not found</h1>"; return; }
  const R = d.ride, D = R.driver, t = D.trust;
  const status = { pending_payment: "Waiting for payment", confirmed: "Seat confirmed ✓", boarded: "On board — have a good trip!", cancelled: "Cancelled", refunded: "Cancelled & refunded", no_show: "Marked as no-show" }[d.status] || d.status;
  app.innerHTML = `
    <div class="card"><div class="mut">${esc(R.from)} → ${esc(R.to)}</div><h1>${esc(status)}</h1><div class="mut">${esc(when(R.departAt))} · ${d.seats} seat${d.seats > 1 ? "s" : ""} · ${inr(d.amount)}</div></div>
    ${d.code ? `<div class="card"><div class="mut" style="text-align:center">Your ride code — tell it to the driver when you get in</div><div class="code">${d.code}</div></div>` : ""}
    <div class="card"><div class="mut">Your driver</div><div class="ride" style="margin-top:6px">${t && t.photo ? `<img src="${esc(t.photo)}">` : `<div class="ph"></div>`}
      <div><b style="font-size:18px">${esc(D.name)}</b><div>${t && t.idChecked ? '<span class="pill">✓ Licence checked</span>' : ""}${t && t.police ? '<span class="pill">✓ Police-verified</span>' : ""}</div><div class="mut">${esc(R.car)}</div></div></div>
      ${D.phone ? `<a class="btn light" href="tel:${esc(D.phone)}">📞 Call ${esc(D.name.split(" ")[0])}</a>` : ""}</div>
    <div class="card"><div class="row"><span class="mut">Leaving</span><span>${esc(when(R.departAt))}</span></div><div class="row"><span class="mut">Route</span><span style="text-align:right">${esc([R.from, ...R.stops.map((s) => s.name), R.to].join(" → "))}</span></div>${d.pickup ? `<div class="row"><span class="mut">Your pickup</span><span>${esc(d.pickup)}</span></div>` : ""}</div>
    <div id="act"></div>
    <div class="card mut" style="text-align:center">Problem? Call WeAid on <a href="tel:+918064267771">080 6426 7771</a></div>`;
  const act = document.getElementById("act");
  if (d.status === "pending_payment") act.innerHTML = `<div class="card"><b>Payment pending</b><div class="mut">WeAid will call you to collect ${inr(d.amount)} — your seats are held for 30 minutes.</div></div>`;
  if (d.cancel && d.cancel.allowed && d.status === "confirmed") {
    act.innerHTML = `<button class="btn red" id="cx">Cancel my booking</button><div class="mut" style="text-align:center;margin-top:6px">${esc(d.cancel.words)}</div><div class="err" id="err"></div>`;
    document.getElementById("cx").onclick = async (e) => {
      if (!confirm("Cancel this booking? " + d.cancel.words)) return;
      e.target.disabled = true;
      try { await api({ action: "cancel", seatId: S, k: K }); showSeat(); } catch (x) { document.getElementById("err").textContent = x.message; e.target.disabled = false; }
    };
  }
}

/* ---------- search & book ---------- */
function showSearch() {
  app.innerHTML = `<h1>Find a carpool</h1><div class="mut">Share a ride with someone already going your way. Drivers' licences are checked by WeAid; you pay when you book.</div>
    <div class="card">
      <label>From<input id="from" placeholder="e.g. Kakkanad" autocomplete="off"></label>
      <label>To<input id="to" placeholder="e.g. Thrissur" autocomplete="off"></label>
      <label>Date<input id="date" type="date"></label>
      <button class="btn" id="go">Search rides</button><div class="err" id="err"></div>
    </div><div id="results"></div>`;
  attachPlace(document.getElementById("from")); attachPlace(document.getElementById("to"));
  document.getElementById("date").value = new Date(Date.now() + 5.5 * 3600e3).toISOString().slice(0, 10);
  document.getElementById("go").onclick = search;
}
let lastFrom = null;
async function search() {
  const f = document.getElementById("from"), t = document.getElementById("to"), err = document.getElementById("err");
  err.textContent = "";
  if (!f.place || !t.place) { err.textContent = "Pick both places from the suggestions."; return; }
  lastFrom = f.place;
  const out = document.getElementById("results"); out.innerHTML = '<div class="mut" style="padding:14px">Searching…</div>';
  try {
    const { rides } = await api({ action: "search", from: f.place, to: t.place, date: document.getElementById("date").value });
    out.innerHTML = rides.length ? rides.map((r) => `<div class="card">
      <div class="ride">${r.photo ? `<img src="${esc(r.photo)}">` : `<div class="ph"></div>`}
        <div style="flex:1"><b>${esc(when(r.departAt))}</b><div class="mut">Pick-up near <b>${esc(r.pickupAt)}</b> · drop near <b>${esc(r.dropAt)}</b></div>
        <div class="mut">${esc(r.driver)} · ${esc(r.car)} ${r.verified ? '<span class="pill">✓ Licence checked</span>' : ""}${r.police ? '<span class="pill">✓ Police-verified</span>' : ""}</div>
        ${r.notes ? `<div class="mut">“${esc(r.notes)}”</div>` : ""}</div>
        <div style="text-align:right"><div class="price">${inr(r.price)}</div><div class="mut">per seat</div><div class="mut">${r.seatsLeft} left</div></div></div>
      <button class="btn light" data-book="${r.id}" data-price="${r.price}" data-fee="${r.fee}" data-left="${r.seatsLeft}">Book a seat</button></div>`).join("")
      : `<div class="card" style="text-align:center"><b>No rides yet for this route</b><div class="mut">Try another day, or check back later.</div></div>`;
    out.querySelectorAll("[data-book]").forEach((b) => (b.onclick = () => bookForm(b.dataset)));
  } catch (e) { out.innerHTML = ""; err.textContent = e.message; }
}
function bookForm(r) {
  const out = document.getElementById("results");
  out.innerHTML = `<div class="card"><b>Book your seat</b>
    <label>Your name<input id="bn"></label><label>Mobile<input id="bp" inputmode="tel" maxlength="14"></label>
    <label>Seats<select id="bs">${[1, 2, 3, 4].filter((n) => n <= +r.left).map((n) => `<option>${n}</option>`).join("")}</select></label>
    <label>Pickup point (optional)<input id="bpu" placeholder="e.g. Edappally signal" value="${esc(lastFrom ? lastFrom.name : "")}"></label>
    <div class="mut" id="tot" style="margin-top:10px"></div>
    <button class="btn" id="pay">Book & pay</button><div class="err" id="err2"></div>
    <div class="mut" style="margin-top:8px">Cancel more than 2 hours before for a refund (the ₹${r.fee}/seat booking fee isn't refunded). <a href="/refunds">Policy</a></div></div>`;
  const tot = () => { const n = +document.getElementById("bs").value; document.getElementById("tot").innerHTML = `${n} × ${inr(r.price)} + booking fee ${inr(n * r.fee)} = <b>${inr(n * (+r.price + +r.fee))}</b>`; };
  document.getElementById("bs").onchange = tot; tot();
  document.getElementById("pay").onclick = async (e) => {
    e.target.disabled = true;
    try {
      const d = await api({ action: "book", rideId: r.book, name: document.getElementById("bn").value, phone: document.getElementById("bp").value, seats: document.getElementById("bs").value, pickup: document.getElementById("bpu").value });
      const k = new URL(d.link).searchParams.get("k");
      if (!d.pay) { location.href = d.link; return; }
      new Razorpay({
        key: d.pay.key, order_id: d.pay.orderId, amount: d.pay.amount, currency: d.pay.currency, name: "WeAid Carpool",
        prefill: { name: document.getElementById("bn").value, contact: document.getElementById("bp").value }, theme: { color: "#0d9488" },
        handler: async (p) => { try { await api({ action: "paid", seatId: d.seatId, k, ...p }); } catch {} location.href = d.link; },
        modal: { ondismiss: () => { e.target.disabled = false; document.getElementById("err2").textContent = "Payment not finished — your seat is held for 30 minutes."; } },
      }).open();
    } catch (x) { document.getElementById("err2").textContent = x.message; e.target.disabled = false; }
  };
}
if (q.get("s")) showSeat(); else showSearch();
</script>
</body>
</html>
