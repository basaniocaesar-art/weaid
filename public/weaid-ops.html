<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>WeAid Ops</title>
<link rel="icon" href="/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--orange:#f97316;--ink:#0b0f14;--mut:#5b6573;--line:#e7ebf0;--bg:#f6f8fa;--teal:#0d9488;--teal-d:#0f766e;--amber:#b45309;--red:#b91c1c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.45}
.top{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.top div{max-width:900px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.logo{font-weight:800;font-size:20px}.logo b{color:var(--orange)}
main{max-width:900px;margin:0 auto;padding:14px 16px 80px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.tabs button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.job{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.pill{display:inline-block;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px;background:#eef2f6}
.pill.finding{background:#fef3c7;color:var(--amber)}.pill.unpaid{background:#fee2e2;color:var(--red)}.pill.quoted,.pill.scheduled,.pill.working,.pill.visiting,.pill.on_the_way,.pill.arrived{background:#ccfbf1;color:var(--teal-d)}.pill.done{background:#dcfce7;color:#166534}
.mut{color:var(--mut);font-size:13.5px}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.btn{font:inherit;font-weight:700;font-size:14px;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:#fff;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.dark{background:var(--ink);color:#fff;border-color:var(--ink)}.btn.wa{background:#25d366;border-color:#25d366;color:#fff}
.panel{margin-top:12px;border-top:1px dashed var(--line);padding-top:12px}
.pro{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.sel{font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);width:100%;background:#fff}
input{font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
#login{max-width:380px;margin:60px auto;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px}
</style>
</head>
<body>
<div class="top"><div><span class="logo"><img src="/icon-192.png" alt="" style="width:30px;height:30px;vertical-align:middle;margin-right:6px;border-radius:7px">We<b>Aid</b> Ops</span><span class="mut" id="stamp"></span></div></div>
<div id="login" hidden>
  <h2 style="margin:0 0 6px">WeAid Ops</h2>
  <div class="mut">Enter your ops key (from the WeAid alert emails).</div>
  <input id="key" type="password" style="margin-top:12px" placeholder="Ops key">
  <button class="btn dark" style="margin-top:10px;width:100%" id="enter">Open</button>
</div>
<main id="app" hidden>
  <div class="tabs" id="tabs"></div>
  <div id="list"></div>
</main>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const when = (iso) => iso ? new Date(iso).toLocaleString("en-IN", { weekday: "short", day: "numeric", month: "short", hour: "numeric", minute: "2-digit" }) : "ASAP";
let KEY = ""; try { KEY = localStorage.getItem("weaid_ops_key") || ""; } catch {}
const fromHash = new URLSearchParams(location.hash.slice(1)).get("k"); if (fromHash) { KEY = fromHash; try { localStorage.setItem("weaid_ops_key", KEY); } catch {} history.replaceState(null, "", "/ops"); }
let jobs = [], tab = "open", openPanel = null;
const TABS = { open: "Needs action", bills: "Bill not sent", live: "In progress", done: "Done", all: "All", issues: "Issues", pros: "Pros", calls: "Call list", jobsportal: "WeAid Jobs", carpool: "Carpool" };
const dueAfter = (j) => Boolean(j.payment && j.payment.mode === "pay_after" && j.stage === "done" && j.payment.due > 0);
// A finished pay-after job whose bill nobody has sent on WhatsApp yet (the pro or us) and that is still unpaid.
const billUnsent = (j) => Boolean(j.bill && !j.bill.sent && j.bill.status !== "paid");
const inTab = (j) => tab === "all" || (tab === "open" ? ["unpaid", "finding", "awaiting_advance"].includes(j.stage) || (j.quote && j.stage === "done" && j.quote.money.balanceDue) || dueAfter(j) : tab === "bills" ? billUnsent(j) : tab === "live" ? ["assigned", "on_the_way", "arrived", "visiting", "quoted", "scheduled", "working"].includes(j.stage) : ["done", "cancelled", "refunded"].includes(j.stage));

async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", "X-Ops-Key": KEY }, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 401) { showLogin(); throw new Error("key"); }
  const d = await r.json(); if (!r.ok) throw new Error(d.error || "failed"); return d;
}
function showLogin() { document.getElementById("app").hidden = true; document.getElementById("login").hidden = false; }
document.getElementById("enter").onclick = () => { KEY = document.getElementById("key").value.trim(); try { localStorage.setItem("weaid_ops_key", KEY); } catch {} start(); };

function render() {
  const GROUP = { open: ["unpaid", "finding", "awaiting_advance"], live: ["assigned", "on_the_way", "arrived", "visiting", "quoted", "scheduled", "working"], done: ["done", "cancelled", "refunded"] };
  const count = (k) => (["pros", "calls", "issues", "carpool", "jobsportal"].includes(k) ? "" : ` (${k === "all" ? jobs.length : k === "bills" ? jobs.filter(billUnsent).length : jobs.filter((j) => GROUP[k].includes(j.stage) || (k === "open" && dueAfter(j))).length})`);
  document.getElementById("tabs").innerHTML = Object.entries(TABS).map(([k, v]) => `<button data-t="${k}" class="${k === tab ? "on" : ""}">${v}${count(k)}</button>`).join("");
  document.querySelectorAll("[data-t]").forEach((b) => b.onclick = () => { tab = b.dataset.t; render(); });
  if (tab === "pros") { renderPros(); return; }
  if (tab === "calls") { renderLeads(); return; }
  if (tab === "issues") { renderIssues(); return; }
  if (tab === "carpool") { renderCarpool(); return; }
  if (tab === "jobsportal") { renderJobsPortal(); return; }
  const shown = jobs.filter(inTab);
  document.getElementById("list").innerHTML = shown.length ? shown.map(card).join("") : `<div class="mut" style="padding:30px;text-align:center">Nothing here.</div>`;
  shown.forEach(wire);
  document.getElementById("stamp").textContent = "Updated " + new Date().toLocaleTimeString("en-IN", { hour: "numeric", minute: "2-digit" });
}
function card(j) {
  return `<div class="job" id="j${j.id}">
    <div style="display:flex;justify-content:space-between;gap:10px;align-items:start">
      <div><b style="font-size:16px">${esc((j.service || "").replace(/_/g, " "))}</b> <span class="mut">· ${esc(j.scope || "")} · ₹${Math.round(j.total || j.amount || 0)}</span>
      <div class="mut">${esc(j.customer_name || "")} · ${esc(j.customer_phone || "")} · ${esc(when(j.scheduled_at))}</div></div>
      <span class="pill ${j.stage}">${esc(j.words)}</span>
    </div>
    ${j.description ? `<div style="margin-top:6px;font-size:14px">${esc(j.description)}</div>` : ""}
    ${j.address ? `<div class="mut" style="margin-top:4px">📍 ${esc(j.address)}</div>` : ""}
    ${j.proof && j.proof.metres != null ? `<div class="mut" style="margin-top:4px">${j.proof.far ? `<b style="color:var(--red)">⚠️ Pro checked in ${j.proof.metres} m from the customer's pin</b>` : `📍 Checked in ${j.proof.metres} m from the pin`}</div>` : ""}
    ${j.proof && j.proof.state !== "not_done" ? `<div style="margin-top:4px;font-size:14px">${{ confirmed: `✅ Customer confirmed · ${"★".repeat(j.proof.rating || 0)}${j.proof.comment ? ` "${esc(j.proof.comment)}"` : ""}`, auto_confirmed: "✅ Auto-confirmed (no complaint in 24 h)", disputed: '<b style="color:var(--red)">⚠️ Customer reported a problem</b>', waiting: "⏳ Waiting for customer to confirm" }[j.proof.state]} · Payout: <b>${{ ready: "ready", on_hold: "on hold", waiting: "waiting" }[j.proof.payout]}</b></div>` : ""}
    ${j.quote ? `<div style="margin-top:6px;font-size:14px;background:#f0fdfa;border-radius:10px;padding:8px 10px">📐 <b>Quote job</b>${j.quote.q ? ` · quote ₹${j.quote.q.total.toLocaleString("en-IN")} · ${j.quote.q.days} day(s)` : " · site visit"}<br>Paid ₹${j.quote.money.paid.toLocaleString("en-IN")} (visit ₹${j.quote.money.visit}, advance ₹${j.quote.money.advance}, balance ₹${j.quote.money.balance})${j.quote.money.advanceDue && ["awaiting_advance"].includes(j.stage) ? ` · <b style="color:var(--red)">advance due ₹${j.quote.money.advanceDue}</b>` : ""}${j.quote.money.balanceDue && j.stage === "done" ? ` · <b style="color:var(--red)">balance due ₹${j.quote.money.balanceDue}</b>` : ""}</div>` : ""}
    <div id="ph${j.id}"></div>
    ${j.payment && j.payment.mode === "pay_after" && !["cancelled", "refunded"].includes(j.stage) ? `<div style="margin-top:6px;font-size:14px">💵 <b>Pay after the job</b> · ${j.paid_at ? "paid" : j.stage === "done" ? `<b style="color:var(--red)">₹${j.payment.due} due from the customer</b>${j.payment.payUrl ? ` · <a href="${esc(j.payment.payUrl)}" target="_blank">link sent</a>` : ""}` : `₹${j.payment.due} to collect when done`}</div>` : ""}
    ${j.bill ? `<div style="margin-top:6px;font-size:14px;background:#fff7ed;border-radius:10px;padding:8px 10px">🧾 <b>Bill ${esc(j.bill.number)}</b> · ₹${j.bill.total.toLocaleString("en-IN")} · ${{ paid: "<b style='color:#166534'>paid</b>", unpaid: `<b style="color:var(--red)">₹${j.bill.due} unpaid</b>`, awaiting_approval: "<b style='color:var(--amber)'>over 3× the quote — waiting for the customer's OK</b>", disputed: "<b style='color:var(--red)'>questioned by the customer</b>" }[j.bill.status] || esc(j.bill.status)}${j.bill.version > 1 ? ` · v${j.bill.version}` : ""}<br><span class="mut">${j.bill.items.map((i) => `${esc(i.text)} ₹${i.amount}`).join(" · ")}</span><br>${j.bill.sent ? `<span style="color:#166534">✓ Bill sent on WhatsApp by ${esc([...new Set(j.bill.shared.map((s) => s.by === "weaid" ? "WeAid" : "the pro"))].join(" and "))}</span>` : `<span class="pill unpaid">Bill not sent</span> <span class="mut">nobody has WhatsApped it yet — send it below</span>`}</div>` : ""}
    ${j.refundDue ? `<div style="margin-top:6px;font-size:14px;color:var(--red)"><b>💸 Refund due — send it by UPI, then tap "Refund sent".</b></div>` : j.refunded ? `<div class="mut" style="margin-top:6px">Refunded via Razorpay</div>` : ""}
    ${j.provider_name ? `<div style="margin-top:6px;font-size:14px">Pro: <b>${esc(j.provider_name)}</b> ${esc(j.provider_phone || "")} · arrival code <b>${j.code}</b></div>` : ""}
    <div class="btns">
      ${["unpaid", "finding", "assigned"].includes(j.stage) ? `<button class="btn dark" data-a="assign">${j.provider_name ? "Change pro" : "Assign a pro"}</button>` : ""}
      ${j.stage === "unpaid" ? `<button class="btn dark" data-a="dispatch_unpaid">Find a pro now (pay after)</button><button class="btn" data-a="paid">Mark paid (cash/UPI)</button>` : ""}
      ${dueAfter(j) ? `<button class="btn dark" data-a="job_paid">✓ Payment received</button>` : ""}
      ${j.bill ? (j.bill.whatsappCustomer ? `<a class="btn wa" href="${esc(j.bill.whatsappCustomer)}" target="_blank" data-shared="whatsapp">💬 WhatsApp bill to customer</a>` : `<span class="btn" style="opacity:.6">No WhatsApp number (customer)</span>`) : ""}
      ${j.bill ? (j.bill.whatsappPro ? `<a class="btn wa" href="${esc(j.bill.whatsappPro)}" target="_blank">💬 WhatsApp pro</a>` : `<span class="btn" style="opacity:.6">No WhatsApp number (pro)</span>`) : ""}
      ${j.bill ? `<a class="btn" href="${esc(j.bill.link)}" target="_blank">Bill</a>` : ""}
      ${dueAfter(j) ? `<button class="btn" data-a="bill">✎ ${j.bill && j.bill.version ? "Correct" : "Enter"} the bill</button>` : ""}
      <a class="btn" href="${j.links.track}" target="_blank">Customer view</a>
      ${j.provider_name ? `<a class="btn" href="${j.links.job}" target="_blank">Pro view</a>` : ""}
      ${j.customer_phone ? `<a class="btn" href="tel:${esc(j.customer_phone)}">Call customer</a>` : ""}
      ${!["cancelled", "refunded"].includes(j.stage) && j.stage !== "done" ? `<button class="btn" data-a="cancel">Cancel &amp; refund</button>` : ""}
      ${j.paid_at && !["cancelled", "refunded"].includes(j.stage) ? `<button class="btn" data-a="refund">Part refund</button>` : ""}
      ${["arrived", "done", "visiting", "quoted", "awaiting_advance", "scheduled", "working"].includes(j.stage) ? `<button class="btn" data-a="photos">📷 Photos</button>` : ""}
      ${j.quote && j.stage === "awaiting_advance" && j.quote.money.advanceDue ? `<button class="btn dark" data-a="adv">✓ Advance received</button>` : ""}
      ${j.quote && j.stage === "done" && j.quote.money.balanceDue ? `<button class="btn dark" data-a="bal">✓ Balance received</button>` : ""}
      ${j.refundDue ? `<button class="btn dark" data-a="refund_sent">✓ Refund sent (UPI)</button>` : ""}
    </div>
    <div class="panel" id="p${j.id}" ${openPanel === j.id ? "" : "hidden"}></div>
  </div>`;
}
function areaOf(j) { const p = (j.address || "").split(",").map((s) => s.trim()).filter(Boolean); return p.length > 1 ? p[p.length - 2] : p[0] || ""; }
function wire(j) {
  const el = document.getElementById("j" + j.id);
  // Sending the bill from the owner's WhatsApp is remembered, so the "Bill not sent" tab empties as it is done.
  el.querySelectorAll("[data-shared]").forEach((a) => a.addEventListener("click", () => { api("/api/ops", { action: "bill_shared", bookingId: j.id, via: a.dataset.shared }).then(refresh).catch(() => {}); }));
  el.querySelectorAll("[data-a]").forEach((b) => b.onclick = async () => {
    const a = b.dataset.a;
    if (a === "bill") {
      const lines = prompt("Bill lines as 'text amount', one per line (optional). Example:\nLabour 600\nCapacitor 350", (j.bill && j.bill.version ? j.bill.items.map((i) => `${i.text} ${i.amount}`).join("\n") : ""));
      if (lines === null) return;
      const items = lines.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => { const m = l.match(/^(.*?)\s*(\d+)\s*$/); return m ? { text: m[1] || "Work", amount: Number(m[2]) } : null; }).filter(Boolean);
      const sum = items.reduce((n, i) => n + i.amount, 0);
      const total = prompt("Total the customer pays WeAid (₹):", String(sum || (j.bill ? j.bill.total : j.payment.due))); if (!total) return;
      try { const d = await api("/api/ops", { action: "final_bill", bookingId: j.id, items, total: Number(total) }); alert(d.needsApproval ? `Bill ₹${d.total} is over 3× the quote (₹${d.original}) — the customer has been asked to approve it.` : `Bill ₹${d.total} sent.${d.qr ? " QR made." : " No QR (Razorpay not set up)."}`); }
      catch (e) { alert(e.message); }
      return refresh();
    }
    if (a === "paid") { const how = prompt("How did they pay? (cash / UPI)", "UPI"); if (!how) return; await api("/api/ops", { action: "mark_paid", bookingId: j.id, how }); return refresh(); }
    if (a === "dispatch_unpaid") {
      if (!confirm("Start finding a pro now, with the customer paying after the job? Nothing is charged up front.")) return;
      await api("/api/ops", { action: "dispatch_unpaid", bookingId: j.id }); return refresh();
    }
    if (a === "job_paid") {
      const who = prompt(`₹${j.payment.due} received — who has the money? Type "pro" (${j.provider_name || "the pro"} took cash/UPI; WeAid's share goes on their ledger) or "weaid" (paid to WeAid).`, "pro"); if (!who) return;
      const how = prompt("How? (cash / UPI)", "cash"); if (!how) return;
      const amt = prompt("Amount received in ₹:", String(j.payment.due)); if (!amt) return;
      const d = await api("/api/ops", { action: "job_payment_received", bookingId: j.id, amount: Number(amt), how, receivedBy: who.trim().toLowerCase() === "weaid" ? "weaid" : "pro" });
      if (d.due > 0) alert(`Recorded. ₹${d.due} still due.`);
      return refresh();
    }
    if (a === "cancel") {
      const q = await api("/api/ops", { action: "cancel_quote", bookingId: j.id });
      if (!q.allowed) return alert(q.reason);
      const reason = prompt("Reason for cancelling (the customer is told it was cancelled):", "No pro available"); if (reason === null) return;
      let refund = q.paid;
      if (q.paid) { const r = prompt(`Paid ₹${q.paid}. How much to refund?`, String(q.paid)); if (r === null) return; refund = Number(r) || 0; }
      const d = await api("/api/ops", { action: "cancel", bookingId: j.id, reason, refund });
      alert(d.refundMode === "razorpay" ? `Cancelled. ₹${d.refund} refunded via Razorpay.` : d.refundMode === "manual" ? `Cancelled. Send ₹${d.refund} back by UPI, then tap "Refund sent".` : "Cancelled. Nothing to refund.");
      return refresh();
    }
    if (a === "refund") {
      const r = prompt(`Part refund for this job (paid ₹${Math.round(j.total || j.amount || 0)}). Amount in ₹:`); if (!r) return;
      const reason = prompt("Reason (for your records):", "Customer not fully satisfied") || "";
      const d = await api("/api/ops", { action: "refund", bookingId: j.id, amount: Number(r), reason });
      alert(d.mode === "razorpay" ? `₹${d.amount} refunded via Razorpay.` : d.mode === "manual" ? `Send ₹${d.amount} back by UPI, then tap "Refund sent".` : "Nothing refunded.");
      return refresh();
    }
    if (a === "adv" || a === "bal") {
      const due = a === "adv" ? j.quote.money.advanceDue : j.quote.money.balanceDue;
      const amt = prompt(`${a === "adv" ? "Advance" : "Balance"} received by UPI/cash — amount in ₹:`, String(due)); if (!amt) return;
      await api("/api/ops", { action: "payment_received", bookingId: j.id, what: a === "adv" ? "advance" : "balance", amount: Number(amt), how: "UPI" });
      return refresh();
    }
    if (a === "photos") {
      const box = document.getElementById("ph" + j.id);
      if (box.innerHTML) { box.innerHTML = ""; return; }
      const { photos } = await api("/api/ops", { action: "photos", bookingId: j.id });
      box.innerHTML = photos.length ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:10px">${photos.map((x) => `<a href="${x.url}" target="_blank"><img src="${x.url}" style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px"><div class="mut" style="font-size:12px">${x.type}</div></a>`).join("")}</div>` : '<div class="mut" style="margin-top:8px">No photos yet.</div>';
      return;
    }
    if (a === "refund_sent") { await api("/api/ops", { action: "refund_sent", bookingId: j.id }); return refresh(); }
    if (a === "assign") { openPanel = openPanel === j.id ? null : j.id; render(); if (openPanel) loadPros(j); }
  });
}
async function loadPros(j) {
  const p = document.getElementById("p" + j.id);
  p.innerHTML = `<div class="mut">Finding pros near ${esc(areaOf(j) || "Kochi")}…</div>`;
  let pros = [];
  try { pros = (await api(`/api/ops?pros=${encodeURIComponent(j.service)}&area=${encodeURIComponent(areaOf(j))}`)).pros; } catch {}
  p.innerHTML = `<b>Pick a pro</b> <span class="mut">— call them first to check they can come</span>
    ${pros.map((x) => `<div class="pro"><div><b>${esc(x.name)}</b> ${x.signedUp ? '<span class="pill done">on WeAid</span>' : ""} ${x.nearby ? '<span class="pill">nearby</span>' : ""}<div class="mut">${esc(x.areas.join(", "))}${x.rating ? ` · ★ ${x.rating} (${x.reviews})` : ""}</div></div>
      <div style="display:flex;gap:6px"><a class="btn" href="tel:${esc(x.phone)}">Call</a><button class="btn dark" data-pick="${esc(x.id)}" data-n="${esc(x.name)}" data-ph="${esc(x.phone)}">Assign</button></div></div>`).join("") || '<div class="mut">No pros listed for this service.</div>'}
    <div style="margin-top:12px"><b>Or someone else</b></div>
    <div class="grid2"><input id="n${j.id}" placeholder="Name"><input id="ph${j.id}" placeholder="Mobile" inputmode="tel"></div>
    <button class="btn dark" style="margin-top:8px" id="go${j.id}">Assign</button>
    <div id="out${j.id}"></div>`;
  const assign = async (name, phone, providerId) => {
    const out = document.getElementById("out" + j.id);
    out.innerHTML = '<div class="mut" style="margin-top:8px">Assigning…</div>';
    try {
      const d = await api("/api/ops", { action: "assign", bookingId: j.id, name, phone, providerId });
      out.innerHTML = `<div style="margin-top:12px"><b>Now send both messages:</b></div><div class="btns">
        ${d.whatsappPro ? `<a class="btn wa" href="${d.whatsappPro}" target="_blank">WhatsApp the pro</a>` : ""}
        ${d.whatsappCustomer ? `<a class="btn wa" href="${d.whatsappCustomer}" target="_blank">WhatsApp the customer</a>` : ""}</div>`;
      const k = openPanel; await refresh(); openPanel = k; render();
      document.getElementById("p" + j.id).hidden = false;
      document.getElementById("p" + j.id).innerHTML = out.outerHTML;
    } catch (e) { out.innerHTML = `<div style="color:var(--red);margin-top:8px">${esc(e.message)}</div>`; }
  };
  p.querySelectorAll("[data-pick]").forEach((b) => b.onclick = () => assign(b.dataset.n, b.dataset.ph, b.dataset.pick));
  document.getElementById("go" + j.id).onclick = () => assign(document.getElementById("n" + j.id).value, document.getElementById("ph" + j.id).value, null);
}

const leadName = (c) => LEAD_NAME[c] || c.replace(/_/g, " ");

function parseCsv(text) {
  const rows = []; let row = [], cell = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; } else if (ch === '"') q = false; else cell += ch; }
    else if (ch === '"') q = true; else if (ch === ",") { row.push(cell); cell = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell || row.length) { row.push(cell); rows.push(row); }
  const [head, ...body] = rows.filter((r) => r.some((x) => x.trim()));
  const h = head.map((x) => x.trim().toLowerCase());
  const col = (...names) => names.map((n) => h.indexOf(n)).find((i) => i >= 0);
  const I = { phone: col("phone"), name: col("name", "business_name"), category: col("category"), address: col("address"), area: col("area"), rating: col("rating"), reviews: col("reviews"), website: col("website") };
  return body.map((r) => Object.fromEntries(Object.entries(I).map(([k, i]) => [k, i === undefined ? "" : r[i] || ""])));
}

function leadMatches(l) {
  const st = LSTATUS[l.p]?.s || "";
  if (lf.st === "todo" ? st && st !== "call_back" && st !== "no_answer" : lf.st && lf.st !== "all" && st !== lf.st) return false;
  if (lf.svc && !l.c.includes(lf.svc)) return false;
  if (lf.area && l.a !== lf.area) return false;
  if (lf.q) { const q = lf.q.toLowerCase(); if (!l.n.toLowerCase().includes(q) && !l.p.includes(q.replace(/\D/g, "") || "~")) return false; }
  return true;
}

async function leadAddPro(phone, btn) {
  const l = LEADS.find((x) => x.p === phone);
  const services = [...new Set(l.c.map((c) => LEAD_SVC[c]).filter(Boolean))];
  btn.textContent = "Adding…";
  try {
    const { added } = await api("/api/ops", { action: "add_pros", pros: [{ name: l.n, phone, services, area: l.a }] });
    const a = added[0];
    if (a.error) { btn.textContent = a.error; return; }
    await api("/api/leads", { action: "status", phone, status: "joined" }); LSTATUS[phone] = { ...(LSTATUS[phone] || {}), s: "joined" };
    btn.outerHTML = `<a class="btn wa" target="_blank" href="${a.whatsapp}">Send app code on WhatsApp</a>`;
  } catch (e) { btn.textContent = e.message; }
}

function wireImport() {
  const f = document.getElementById("leadFile"); if (!f) return;
  f.onchange = async () => {
    const out = document.getElementById("leadImp");
    let rows = [];
    for (const file of f.files) rows = rows.concat(parseCsv(await file.text()));
    let total = 0, added = 0;
    for (let i = 0; i < rows.length; i += 1500) {   // under Vercel's 4.5 MB request limit
      out.textContent = `Uploading ${Math.min(i + 1500, rows.length)} of ${rows.length}…`;
      try { const d = await api("/api/leads", { action: "import", rows: rows.slice(i, i + 1500) }); added += d.added; total = d.total; } catch (e) { out.textContent = e.message; return; }
    }
    out.textContent = `Added ${added} new · ${total} on the list.`;
    LEADS = null; setTimeout(renderLeads, 800);
  };
}

  const list = document.getElementById("list");
  list.innerHTML = `<div class="job"><b>➕ Add pros you know</b><div class="mut">One per line: <b>name, mobile, service(s), area</b> — e.g. <i>Ravi Kumar, 9876543210, electrical plumbing, Kakkanad</i>. Services: ${SVC.join(", ")}</div>
    <textarea id="addTxt" rows="4" style="width:100%;margin-top:8px;font:inherit;padding:10px;border-radius:10px;border:1.5px solid var(--line)" placeholder="Ravi Kumar, 9876543210, roofing, Aluva"></textarea>
    <button class="btn dark" id="addGo" style="margin-top:8px">Add &amp; get WhatsApp links</button><div id="addOut"></div></div>
    <div class="job"><b>WeAid Pro app</b><div class="mut">Approve a pro, then send them their app code. Once online in the app, paid jobs near them pop up on their phone.</div>
    <input id="teamQ" placeholder="Find any pro by name or number" value="${esc(teamQ)}" style="margin-top:10px"></div><div id="teamList" class="mut" style="padding:10px">Loading…</div>`;
  document.getElementById("addGo").onclick = async () => {
    const pros = document.getElementById("addTxt").value.split("\n").map((l) => l.trim()).filter(Boolean).map((l) => {
      const parts = l.split(",").map((x) => x.trim());
      return { name: parts[0], phone: parts[1], services: (parts[2] || "").split(/[\s/+&]+/).filter(Boolean), area: parts[3] || "" };
    });
    if (!pros.length) return;
    const out = document.getElementById("addOut"); out.innerHTML = '<div class="mut">Adding…</div>';
    try {
      const { added } = await api("/api/ops", { action: "add_pros", pros });
      out.innerHTML = added.map((a) => a.error ? `<div style="color:var(--red);font-size:14px;margin-top:6px">✗ ${esc(a.name || "?")} ${esc(a.phone || "")}: ${esc(a.error)}</div>`
        : `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px;font-size:14px"><span>✓ ${esc(a.name)} ${a.existed ? "(already listed — updated)" : ""} · code ${a.code}</span><a class="btn wa" target="_blank" href="${a.whatsapp}">Send on WhatsApp</a></div>`).join("");
    } catch (e) { out.innerHTML = `<div style="color:var(--red)">${esc(e.message)}</div>`; }
  };
  const q = document.getElementById("teamQ");
  q.onkeydown = (e) => { if (e.key === "Enter") { teamQ = q.value.trim(); renderPros(); } };
  try { team = (await api(`/api/ops?team=1${teamQ ? `&q=${encodeURIComponent(teamQ)}` : ""}`)).team; } catch { return; }
  document.getElementById("teamList").outerHTML = team.length ? team.map((p) => `<div class="job"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start">
      <div><b>${esc(p.name)}</b> ${p.online ? '<span class="pill on_the_way">online</span>' : ""} ${p.hasApp ? '<span class="pill">has app</span>' : ""}
      <div class="mut">${esc(p.phone || "")} · ${esc((p.services || []).join(", "))}${p.areas.length ? ` · ${esc(p.areas.join(", "))}` : ""}</div>
      <div class="mut">App code: <b>${p.appCode}</b></div>
      ${p.owed > 0 ? `<div style="font-size:14px;margin-top:4px;color:${p.blocked ? "var(--red)" : "var(--amber)"}">💵 Holding <b>₹${p.owed}</b> of WeAid's share from cash jobs${p.blocked ? ` — over ₹${p.owedLimit}, no new offers until settled` : " (comes off next payout)"}</div>` : ""}</div>
      <span class="pill ${p.approved ? "done" : p.kyc === "submitted" ? "finding" : "unpaid"}">${p.approved ? "Approved" : p.kyc === "submitted" ? "ID to review" : p.kyc === "rejected" ? "Rejected" : "No ID yet"}</span></div>
    ${p.idType ? `<div class="mut">Verified with: ${esc(p.idType)}</div>` : ""}
    <div id="kyc${p.id}"></div>
    <div class="btns">
      ${p.kyc === "submitted" && !p.approved ? `<button class="btn dark" data-review="${p.id}">Review ID</button>` : `<button class="btn ${p.approved ? "" : "dark"}" data-ap="${p.id}" data-v="${p.approved ? "unapprove" : "approve"}">${p.approved ? "Remove approval" : "Approve without ID"}</button>`}
      <button class="btn wa" data-code="${p.id}">WhatsApp app code</button>
      ${p.owed > 0 ? `<button class="btn dark" data-settle="${p.id}" data-owed="${p.owed}">✓ Paid WeAid back</button>` : ""}
      ${p.phone ? `<a class="btn" href="tel:${esc(p.phone)}">Call</a>` : ""}
    </div></div>`).join("") : `<div class="mut" style="padding:20px;text-align:center">${teamQ ? "Nobody found." : "No pros have signed up yet. Search above to invite one from the directory."}</div>`;
  list.querySelectorAll("[data-ap]").forEach((b) => b.onclick = async () => { await api("/api/ops", { action: b.dataset.v, providerId: b.dataset.ap }); renderPros(); });
  list.querySelectorAll("[data-review]").forEach((b) => b.onclick = () => reviewId(b.dataset.review));
  list.querySelectorAll("[data-code]").forEach((b) => b.onclick = async () => { const d = await api("/api/ops", { action: "app_code", providerId: b.dataset.code }); if (d.whatsapp) window.open(d.whatsapp, "_blank"); });
  list.querySelectorAll("[data-settle]").forEach((b) => b.onclick = async () => {
    const amt = prompt(`How much did they pay WeAid? (owes ₹${b.dataset.owed})`, b.dataset.owed); if (!amt) return;
    const how = prompt("How? (UPI / cash)", "UPI"); if (!how) return;
    await api("/api/ops", { action: "owed_settled", providerId: b.dataset.settle, amount: Number(amt), how }); renderPros();
  });
}

const tick = (v) => v === "yes" || v === "likely_same" || v === "no" && false ? "✅" : v === "partly" || v === "unclear" || v === "cannot_tell" || v === "unreadable" ? "⚠️" : "❌";
async function reviewId(pid) {
  const box = document.getElementById("kyc" + pid);
  box.innerHTML = '<div class="mut" style="margin-top:8px">Loading ID…</div>';
  const { check } = await api("/api/ops", { action: "kyc_view", providerId: pid });
  if (!check) { box.innerHTML = '<div class="mut">Nothing uploaded.</div>'; return; }
  const sec = (k, title) => {
    const s = check.steps[k]; if (!s) return `<div class="mut" style="margin-top:10px"><b>${title}:</b> not uploaded</div>`;
    const img = s.url ? (s.url.includes(".pdf") ? `<a class="btn" href="${s.url}" target="_blank">Open PDF</a>` : `<a href="${s.url}" target="_blank"><img src="${s.url}" style="width:100%;max-width:420px;border-radius:12px;border:1px solid var(--line);margin-top:6px"></a>`) : '<div class="mut">(photo deleted)</div>';
    const facts = k === "id"
      ? [`${tick(s.nameMatches)} Name on ID: <b>${esc(s.name || "?")}</b>`, `${tick(s.face)} Face vs card photo: ${esc(s.face)} <span class="mut">(rough AI impression)</span>`, `${s.expired === "yes" ? "❌ Expired" : "✅ Not expired"}`, s.edited ? "⚠️ Possible editing" : ""]
      : [`${tick(s.nameMatches)} Name: <b>${esc(s.name || "?")}</b>`, `Issuer: ${esc(s.issuer || "?")}`, `Issued: ${esc(s.issued || "?")}`, s.remarks === "none" ? "✅ No adverse remarks" : `⚠️ Remarks: ${esc(s.remarks)}`, s.edited ? "⚠️ Possible editing" : ""];
    return `<div style="margin-top:12px"><b>${title}</b> <span class="pill ${s.verdict === "ok" ? "done" : s.verdict === "redo" ? "unpaid" : "finding"}">AI: ${s.verdict}</span>
      <div style="font-size:14px;margin-top:4px">${esc(s.summary)}</div>
      <div style="font-size:14px;margin-top:4px">${facts.filter(Boolean).join("<br>")}</div>
      ${s.problems.length ? `<div class="mut">Problems: ${esc(s.problems.join("; "))}</div>` : ""}${img}</div>`;
  };
  box.innerHTML = `<div class="panel">${sec("id", "ID selfie")}${sec("pcc", "Police certificate")}
    <div class="btns" style="margin-top:12px">
      <button class="btn dark" data-k="approve">✅ Approve</button>
      <button class="btn wa" data-k="call">📹 WhatsApp video call</button>
      <button class="btn" data-k="reject">Reject</button>
    </div><div class="mut" style="margin-top:6px">Approve keeps the ID as WeAid's private record. Reject deletes it.</div></div>`;
  box.querySelectorAll("[data-k]").forEach((b) => b.onclick = async () => {
    const k = b.dataset.k;
    let note = "";
    if (k === "reject") { note = prompt("Reason (the pro will see this):", "We couldn't confirm your identity from the photo. Please call WeAid."); if (note === null) return; }
    const d = await api("/api/ops", { action: "kyc_" + k, providerId: pid, note });
    if (k === "call" && d.whatsapp) window.open(d.whatsapp, "_blank");
    renderPros();
  });
}

async function refresh() { try { jobs = (await api("/api/ops")).jobs; if (!openPanel && !["pros", "calls", "issues", "carpool", "jobsportal"].includes(tab)) render(); } catch {} }
async function start() {
  if (!KEY) return showLogin();
  document.getElementById("login").hidden = true; document.getElementById("app").hidden = false;
  await refresh(); render();
}
start();
setInterval(() => { if (!openPanel) refresh(); }, 30000);
</script>
</body>
</html>
