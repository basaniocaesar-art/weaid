<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Find a Pro — WeAid</title>
<meta name="description" content="Find verified local service providers near you — electricians, plumbers, cleaners, AC repair & more.">
<link rel="icon" href="/weaid-mark.svg">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1A6E5E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/weaid-theme.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
.head{padding:34px 20px 6px;max-width:760px;margin:0 auto;text-align:center;}
.head .eyebrow{margin-bottom:14px;}
.head .h1{font-size:32px;margin-bottom:10px;}
@media(min-width:900px){.head{padding:52px 20px 6px;}.head .h1{font-size:52px;}}
.head .lead{max-width:520px;margin:0 auto;}

.searchbar{position:sticky;top:64px;z-index:50;background:rgba(255,255,255,0.92);backdrop-filter:blur(12px);padding:16px 20px;border-bottom:1px solid var(--bdr);}
.sb-inner{max-width:820px;margin:0 auto;background:#fff;border:1.5px solid var(--bdr2);border-radius:16px;padding:10px;display:grid;grid-template-columns:1fr;gap:8px;box-shadow:var(--shadow-sm);}
@media(min-width:640px){.sb-inner{grid-template-columns:1fr 1fr auto;align-items:center;}}
.sb-field{position:relative;}
.sb-field select,.sb-field input{width:100%;padding:14px 14px;background:var(--bg-soft);border:1.5px solid transparent;border-radius:12px;color:var(--text);font-family:inherit;font-size:15px;outline:none;transition:all .15s;}
.sb-field select:focus,.sb-field input:focus{background:#fff;border-color:var(--ink);}
.sb-field select{appearance:none;-webkit-appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' fill='none' stroke='%238A909E' stroke-width='2.2'><path d='M2 4l5 5 5-5'/></svg>");background-repeat:no-repeat;background-position:right 14px center;}

.results{max-width:var(--maxw);margin:0 auto;padding:20px 20px 100px;}
.res-meta{font-size:18px;font-weight:700;color:var(--ink);margin:6px 0 16px 2px;}
.res-meta span{color:var(--t2);font-weight:500;}
.grid{display:grid;grid-template-columns:1fr;gap:14px;}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr;}}
@media(min-width:980px){.grid{grid-template-columns:1fr 1fr 1fr;gap:18px;}}
@media(min-width:1360px){.grid{grid-template-columns:repeat(4,1fr);gap:20px;}}
@media(min-width:900px){.pcard{padding:24px;}.c-top .avatar{width:64px;height:64px;font-size:1.6rem;}.c-name{font-size:19px;}#availMap{height:280px;}}

.pcard{position:relative;display:flex;flex-direction:column;gap:12px;}
.pcard.feat{border-color:#F0C24B;box-shadow:0 -3px 0 var(--gold) inset,var(--shadow-sm);}
.pcard .topbadge{position:absolute;top:16px;right:16px;}
.c-top{display:flex;align-items:center;gap:12px;}
.c-top .avatar{width:56px;height:56px;font-size:1.4rem;}
.c-name{font-weight:700;color:var(--ink);font-size:17px;display:flex;align-items:center;gap:6px;}
.c-meta{font-size:14px;color:var(--t2);margin-top:2px;}
.c-services{display:flex;flex-wrap:wrap;gap:6px;}
.c-bio{font-size:14px;color:var(--t2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.c-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:auto;}
.c-actions .btn{padding:12px;font-size:0.9rem;border-radius:11px;}

.empty{text-align:center;padding:64px 20px;color:var(--t2);grid-column:1/-1;}
.empty .emo{font-size:2.6rem;margin-bottom:14px;}
.empty a{color:var(--teal-text);font-weight:700;}

.avail{max-width:var(--maxw);margin:16px auto 0;padding:0 20px;}
.avail-count{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;color:var(--ink);margin-bottom:10px;}
.avail-dot{width:9px;height:9px;border-radius:50%;background:var(--success);box-shadow:0 0 0 0 rgba(23,138,69,0.5);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(23,138,69,0.45)}70%{box-shadow:0 0 0 8px rgba(23,138,69,0)}100%{box-shadow:0 0 0 0 rgba(23,138,69,0)}}
#availMap{height:220px;border-radius:16px;border:1px solid var(--bdr);z-index:0;}
.loc-field{position:relative;}
.loc-field input{padding-left:38px!important;padding-right:38px!important;}
.loc-pin{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:15px;pointer-events:none;z-index:1;}
.loc-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:8px;background:var(--teal-dim);color:var(--teal-text);font-size:15px;display:flex;align-items:center;justify-content:center;line-height:1;}
.loc-btn:hover{background:var(--teal);color:#fff;}
.loc-suggest{position:absolute;top:calc(100% + 6px);left:0;right:0;background:#fff;border:1px solid var(--bdr2);border-radius:12px;box-shadow:var(--shadow-md);z-index:60;overflow:hidden;display:none;}
.loc-suggest.on{display:block;}
.loc-suggest .opt{padding:11px 14px;font-size:14px;color:var(--text);cursor:pointer;display:flex;gap:8px;align-items:center;border-bottom:1px solid var(--bdr);}
.loc-suggest .opt:last-child{border-bottom:none;}
.loc-suggest .opt:hover{background:var(--bg-soft);}
.loc-suggest .opt .ic{color:var(--teal-text);flex-shrink:0;}
.loc-suggest .opt .tx{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cta-strip{max-width:820px;margin:16px auto 0;padding:0 20px;}
.cta-box{background:var(--teal-dim);border-radius:14px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.cta-box .t{font-size:15px;font-weight:600;color:var(--ink);}
</style>
</head>
<body>
<nav class="nav" id="nav">
  <a href="/" class="logo"><div class="lm">W</div><div class="lt">weaid<span>.in</span></div></a>
  <div class="nav-right"><a href="/list-business" class="btn btn-primary btn-pill btn-sm">List your business</a></div>
</nav>

<div class="head">
  <div class="eyebrow">Find a Pro</div>
  <h1 class="h1">Trusted local pros, near you</h1>
  <p class="lead">Pick a service and your location — verified providers show up instantly.</p>
</div>

<div class="searchbar">
  <div class="sb-inner">
    <div class="sb-field">
      <select id="fService" aria-label="Service">
        <option value="">All services</option>
        <option value="electrical">⚡ Electrical Work</option>
        <option value="plumbing">🔧 Plumbing</option>
        <option value="cleaning">🧹 Deep Cleaning</option>
        <option value="ac">❄️ AC & Appliance Repair</option>
        <option value="carpentry">🪚 Carpentry</option>
        <option value="renovation">🏠 Home Renovation</option>
        <option value="pickup">✈️ Airport Transfers</option>
        <option value="caretaking">🏡 Property Caretaking</option>
        <option value="painting">🎨 Painting</option>
        <option value="pest_control">🐛 Pest Control</option>
        <option value="cctv">📹 CCTV & Security</option>
        <option value="movers">🚚 Packers & Movers</option>
        <option value="tutor">📚 Home Tutors</option>
        <option value="nursing">🩺 Nurses & Elder Care</option>
        <option value="laundry">🧺 Laundry & Dry Clean</option>
      </select>
    </div>
    <div class="sb-field loc-field">
      <span class="loc-pin" id="locPin">📍</span>
      <input id="fCity" type="text" placeholder="Detecting your location…" autocomplete="off">
      <button class="loc-btn" id="locBtn" onclick="autoDetect(true)" title="Use my current location" aria-label="Use my current location">⌖</button>
      <div class="loc-suggest" id="locSuggest"></div>
    </div>
    <button class="btn btn-primary" onclick="runSearch()">Search</button>
  </div>
  <div id="locStatus" style="max-width:820px;margin:8px auto 0;text-align:center;font-size:13px;color:var(--t3);"></div>
</div>

<div class="cta-strip">
  <div class="cta-box">
    <span class="t">Are you a service provider?</span>
    <a href="/list-business" class="btn btn-primary btn-pill btn-sm">List free →</a>
  </div>
</div>

<div class="avail" id="availWrap" style="display:none">
  <div class="avail-count" id="availCount"></div>
  <div id="availMap"></div>
</div>

<div class="results">
  <div class="res-meta" id="resMeta"></div>
  <div class="grid" id="grid"></div>
</div>

<script>
const SVC_LABEL={electrical:"Electrical",plumbing:"Plumbing",cleaning:"Cleaning",ac:"AC & Appliance",carpentry:"Carpentry",renovation:"Renovation",pickup:"Airport Transfer",caretaking:"Caretaking",painting:"Painting",pest_control:"Pest Control",cctv:"CCTV & Security",movers:"Packers & Movers",tutor:"Home Tutors",nursing:"Nurses & Elder Care",laundry:"Laundry & Dry Clean"};
function initials(n){return (n||"?").split(" ").map(w=>w[0]).slice(0,2).join("").toUpperCase();}
function stars(r){r=Math.round(r||0);return "★".repeat(r)+"☆".repeat(5-r);}
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function logLead(id,ch){navigator.sendBeacon?navigator.sendBeacon('/api/provider/lead',new Blob([JSON.stringify({providerId:id,channel:ch,service:document.getElementById('fService').value,city:document.getElementById('fCity').value})],{type:'application/json'})):fetch('/api/provider/lead',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({providerId:id,channel:ch})});}
let userLat=null,userLng=null,locPicked=false;
const cityInput=()=>document.getElementById('fCity');
const sugBox=()=>document.getElementById('locSuggest');
const statusEl=()=>document.getElementById('locStatus');
function hideSug(){const b=sugBox();if(b){b.classList.remove('on');b.innerHTML='';}}
function shortName(dn){return String(dn).split(',').slice(0,2).join(',').trim();}

// Reverse-geocode lat/lng → readable area name (free OpenStreetMap Nominatim)
async function reverseGeocode(lat,lng){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=14&addressdetails=1&lat=${lat}&lon=${lng}`,{headers:{'Accept':'application/json'}});
    const d=await r.json();const a=d.address||{};
    const parts=[a.suburb||a.neighbourhood||a.village||a.town||a.city_district,a.city||a.town||a.county].filter(Boolean);
    return parts.length?[...new Set(parts)].slice(0,2).join(', '):shortName(d.display_name||'');
  }catch(e){return '';}
}

// Auto-detect the customer's location (Uber-style) and sort by nearest
function autoDetect(userInitiated){
  const st=statusEl();
  if(!navigator.geolocation){cityInput().placeholder='Your city or area';runSearch();return;}
  cityInput().placeholder='Detecting your location…';
  if(userInitiated)st.textContent='Locating…';
  navigator.geolocation.getCurrentPosition(async p=>{
    userLat=p.coords.latitude;userLng=p.coords.longitude;locPicked=true;
    const name=await reverseGeocode(userLat,userLng);
    cityInput().value=name||'Current location';
    st.textContent='📍 Showing pros nearest to you';
    runSearch();
  },e=>{
    cityInput().placeholder='Your city or area';
    st.textContent=userInitiated?(e.code===1?'Location blocked — type your area instead.':'Couldn’t detect location — type your area.'):'';
    runSearch();
  },{enableHighAccuracy:false,timeout:8000,maximumAge:300000});
}

// Type-to-search places, debounced (Nominatim autocomplete)
let sugTimer=null;
function onCityInput(){
  userLat=null;userLng=null;locPicked=false; // typing = manual until they pick a suggestion
  const q=cityInput().value.trim();
  clearTimeout(sugTimer);
  if(q.length<3){hideSug();return;}
  sugTimer=setTimeout(()=>placeSearch(q),350);
}
async function placeSearch(q){
  try{
    const r=await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=in&limit=5&q=${encodeURIComponent(q)}`,{headers:{'Accept':'application/json'}});
    const list=await r.json();
    if(!Array.isArray(list)||!list.length){hideSug();return;}
    const box=sugBox();
    box.innerHTML=list.map(o=>`<div class="opt" data-lat="${o.lat}" data-lng="${o.lon}" data-name="${esc(shortName(o.display_name))}"><span class="ic">📍</span><span class="tx">${esc(o.display_name)}</span></div>`).join('');
    box.querySelectorAll('.opt').forEach(el=>el.onclick=()=>{
      userLat=+el.dataset.lat;userLng=+el.dataset.lng;locPicked=true;
      cityInput().value=el.dataset.name;hideSug();
      statusEl().textContent='📍 Showing pros nearest to '+el.dataset.name;
      runSearch();
    });
    box.classList.add('on');
  }catch(e){hideSug();}
}

function card(p){
  const badge=p.featured?'<span class="badge badge-feat topbadge">★ Featured</span>':(p.isNew?'<span class="badge badge-new topbadge">New</span>':'');
  const avatar=p.photo_url?`<img src="${esc(p.photo_url)}" alt="">`:initials(p.name);
  const chips=(p.services||[]).slice(0,3).map(s=>`<span class="chip">${esc(SVC_LABEL[s]||s)}</span>`).join("");
  const exp=p.years_experience?`${p.years_experience} yrs · `:"";
  const dist=p.distanceKm!=null?` · <span style="color:var(--teal-text);font-weight:700">${p.distanceKm} km away</span>`:"";
  const rating=p.review_count?`<div class="rating-pill"><span class="star">★</span> ${p.rating} <span style="color:var(--t3);font-weight:600">(${p.review_count})</span></div>`:'<div style="font-size:13px;color:var(--t3)">New pro · no reviews yet</div>';
  const wa=(p.whatsapp||p.phone||"").replace(/[^0-9]/g,"");
  const tel=(p.phone||"").replace(/[^0-9+]/g,"");
  return `<a href="/p/${esc(p.slug)}" class="card pcard ${p.featured?'feat':''} fade-up">
    ${badge}
    <div class="c-top">
      <div class="avatar">${avatar}</div>
      <div>
        <div class="c-name">${esc(p.name)} ${p.verified?'<span class="vtick" title="Verified">✓</span>':''}</div>
        <div class="c-meta">${exp}${esc(p.city||"")}${dist}</div>
      </div>
    </div>
    ${rating}
    <div class="c-services">${chips}</div>
    ${p.bio?`<div class="c-bio">${esc(p.bio)}</div>`:""}
    <div class="c-actions">
      <span class="btn btn-wa" onclick="event.preventDefault();logLead('${p.id}','whatsapp');window.open('https://wa.me/${wa}','_blank')">WhatsApp</span>
      <span class="btn btn-secondary" onclick="event.preventDefault();logLead('${p.id}','call');window.location.href='tel:${tel}'">Call</span>
    </div>
  </a>`;
}

function skeletons(n){let h='';for(let i=0;i<n;i++)h+=`<div class="card"><div style="display:flex;gap:12px;align-items:center"><div class="skel" style="width:56px;height:56px;border-radius:14px"></div><div style="flex:1"><div class="skel" style="height:16px;width:60%;margin-bottom:8px"></div><div class="skel" style="height:12px;width:40%"></div></div></div><div class="skel" style="height:12px;margin-top:14px"></div><div class="skel" style="height:38px;margin-top:14px;border-radius:11px"></div></div>`;return h;}

// Live availability map: shows how many pros are on right now near the customer.
// Pins are placed at each pro's real distance but a pseudo-random bearing, so the
// count + spread are believable without exposing anyone's exact address.
let availMap=null;
function renderAvail(list){
  const wrap=document.getElementById('availWrap');
  if(!(locPicked&&userLat!=null&&userLng!=null&&window.L)){wrap.style.display='none';return;}
  wrap.style.display='block';
  document.getElementById('availCount').innerHTML=`<span class="avail-dot"></span> ${list.length} pro${list.length!==1?'s':''} available near you now`;
  const withDist=list.filter(p=>p.distanceKm!=null);
  setTimeout(()=>{
    if(availMap){availMap.remove();availMap=null;}
    availMap=L.map('availMap',{zoomControl:false,scrollWheelZoom:false,attributionControl:false}).setView([userLat,userLng],13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18}).addTo(availMap);
    L.circleMarker([userLat,userLng],{radius:8,color:'#14171F',weight:3,fillColor:'#fff',fillOpacity:1}).addTo(availMap).bindTooltip('You',{permanent:false});
    let maxD=1;
    withDist.forEach((p,i)=>{
      const br=(i*2.399963); // golden-angle spread, deterministic
      const d=p.distanceKm||0.5; maxD=Math.max(maxD,d);
      const lat=userLat+(d/111)*Math.cos(br);
      const lng=userLng+(d/(111*Math.cos(userLat*Math.PI/180)))*Math.sin(br);
      L.circleMarker([lat,lng],{radius:6,color:'#0E9488',weight:2,fillColor:'#0E9488',fillOpacity:.85}).addTo(availMap).bindTooltip(p.featured?'★ '+esc(p.name):esc(p.name));
    });
    try{availMap.fitBounds(L.latLngBounds([[userLat,userLng]].concat(withDist.map((p,i)=>{const br=i*2.399963,d=p.distanceKm||0.5;return [userLat+(d/111)*Math.cos(br),userLng+(d/(111*Math.cos(userLat*Math.PI/180)))*Math.sin(br)];}))).pad(0.3));}catch(e){}
  },60);
}

async function runSearch(){
  const service=document.getElementById('fService').value;
  const city=document.getElementById('fCity').value.trim();
  const grid=document.getElementById('grid');
  const meta=document.getElementById('resMeta');
  meta.textContent='';
  grid.innerHTML=skeletons(6);
  const params=new URLSearchParams();
  if(service)params.set('service',service);
  // Precise location (detected or picked) → sort by nearest across all pros.
  // Otherwise treat the box as a plain city/area text filter.
  if(locPicked&&userLat!=null&&userLng!=null){params.set('lat',userLat);params.set('lng',userLng);}
  else if(city)params.set('city',city);
  try{
    const r=await fetch('/api/providers/search?'+params.toString());
    const d=await r.json();
    if(!r.ok)throw new Error(d.error||'Search failed');
    const list=d.providers||[];
    if(!list.length){
      meta.textContent='';
      document.getElementById('availWrap').style.display='none';
      grid.innerHTML=`<div class="empty"><div class="emo">🔍</div><div style="font-size:17px;color:var(--ink);font-weight:600;margin-bottom:6px">No pros here yet</div>Be the first to list in ${city?esc(city):'your area'}.<br><br><a href="/list-business" class="btn btn-primary btn-pill">List your business free →</a></div>`;
      return;
    }
    meta.innerHTML=`${d.count} pro${d.count>1?'s':''} <span>${city?'in '+esc(city):'available'}</span>`;
    grid.innerHTML=list.map(card).join("");
    renderAvail(list);
  }catch(e){
    meta.textContent='';
    grid.innerHTML=`<div class="empty"><div class="emo">⚠️</div>${esc(e.message)}</div>`;
  }
}

(function(){
  const q=new URLSearchParams(location.search);
  if(q.get('service'))document.getElementById('fService').value=q.get('service');
  const inp=document.getElementById('fCity');
  inp.addEventListener('input',onCityInput);
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){hideSug();runSearch();}});
  document.addEventListener('click',e=>{if(!e.target.closest('.loc-field'))hideSug();});
  addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('scrolled',scrollY>8));
  if(q.get('city')){inp.value=q.get('city');runSearch();}      // came from a city link
  else autoDetect(false);                                       // Uber-style: auto-detect on arrival
})();
</script>
</body>
</html>
