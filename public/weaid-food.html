<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Food — WeAid</title>
<link rel="icon" href="/icon-192.png">
<meta name="theme-color" content="#FFFFFF">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/weaid-theme.css">
<style>
.wrap{max-width:680px;margin:0 auto;padding:22px 20px 120px}
.h1{font-size:28px;margin-bottom:2px}
.sub{color:var(--t2);font-size:14px;margin-bottom:16px}
.search{width:100%;padding:14px 16px;background:var(--bg-soft);border:1.5px solid transparent;border-radius:12px;font-family:inherit;font-size:16px;outline:none;margin-bottom:16px}
.search:focus{background:#fff;border-color:var(--ink)}
.prov{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--bdr);border-radius:14px;padding:14px;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-sm)}
.prov .av{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,#f0932b,#eb4d4b);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.2rem;flex-shrink:0}
.prov .nm{font-weight:700;font-size:16px;color:var(--ink);display:flex;align-items:center;gap:6px}
.prov .mt{font-size:13px;color:var(--t2);margin-top:2px}
.tag{font-size:10px;font-weight:800;text-transform:uppercase;padding:3px 7px;border-radius:100px;letter-spacing:.05em}
.tag.home{background:var(--teal-dim);color:var(--teal-text)}
.tag.feat{background:var(--gold-dim);color:var(--gold)}
.back{font-size:14px;color:var(--teal-text);font-weight:700;cursor:pointer;margin-bottom:12px;display:inline-block}
.item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--bdr)}
.veg{width:14px;height:14px;border:1.5px solid;border-radius:3px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:3px}
.veg::after{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.veg.y{color:#178A45}.veg.n{color:#D92D20}
.item .nm{font-weight:700;font-size:15px;color:var(--ink)}
.item .ds{font-size:12.5px;color:var(--t2);margin-top:2px}
.item .pr{font-weight:700;font-size:14px;margin-top:4px}
.qty{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0}
.qbtn{width:30px;height:30px;border-radius:8px;background:var(--ink);color:#fff;font-weight:800;font-size:16px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.qadd{padding:8px 16px;border-radius:9px;background:var(--ink);color:#fff;font-weight:700;font-size:13px;cursor:pointer}
.cartbar{position:fixed;bottom:0;left:0;right:0;max-width:680px;margin:0 auto;background:var(--ink);color:#fff;padding:16px 20px calc(16px + env(safe-area-inset-bottom));display:none;align-items:center;justify-content:space-between;cursor:pointer;z-index:80}
.cartbar.on{display:flex}
.cartbar .c{font-weight:700}
.cartbar .g{font-weight:800}
.empty{text-align:center;color:var(--t2);padding:40px 0}
.field{margin-bottom:12px}
.field input{width:100%;padding:13px 14px;background:var(--bg-soft);border:1.5px solid transparent;border-radius:11px;font-family:inherit;font-size:16px;color:var(--text);outline:none}
.field input:focus{background:#fff;border-color:var(--ink)}
.sumrow{display:flex;justify-content:space-between;font-size:14px;color:var(--t2);margin-bottom:6px}
.sumrow.tot{color:var(--ink);font-weight:800;font-size:17px;border-top:1px solid var(--bdr);padding-top:8px;margin-top:8px}
.track-badge{display:inline-block;font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:var(--teal-text);background:var(--teal-dim);padding:6px 12px;border-radius:100px}
</style>
</head>
<body>
<nav class="nav" id="nav">
  <a href="/" class="logo"><div class="lm">W</div><div class="lt">We<span>Aid</span></div></a>
  <div class="nav-right"><a href="/directory" class="nav-link">Services</a></div>
</nav>

<div class="wrap">
  <!-- list -->
  <div id="listView">
    <h1 class="h1">Food near you</h1>
    <p class="sub">Restaurants &amp; home kitchens — delivered by WeAid riders.</p>
    <input class="search" id="city" placeholder="Your city or area" oninput="loadProviders()">
    <div id="providers"><div class="empty">Loading kitchens…</div></div>
  </div>

  <!-- menu -->
  <div id="menuView" style="display:none">
    <span class="back" onclick="showList()">← All kitchens</span>
    <h1 class="h1" id="mName"></h1>
    <p class="sub" id="mMeta"></p>
    <div id="menu"></div>
  </div>

  <!-- checkout -->
  <div id="checkoutView" style="display:none">
    <span class="back" onclick="showMenu()">← Back to menu</span>
    <h1 class="h1">Checkout</h1>
    <div id="orderSummary" style="margin:14px 0"></div>
    <div class="field"><input id="oName" placeholder="Your name"></div>
    <div class="field"><input id="oPhone" type="tel" placeholder="Phone number"></div>
    <div class="field"><input id="oAddr" placeholder="Delivery address (flat, street, landmark)"></div>
    <button class="btn btn-primary btn-block" id="placeBtn" onclick="placeOrder()">Place order</button>
  </div>

  <!-- tracking -->
  <div id="trackView" style="display:none">
    <h1 class="h1">Order placed 🎉</h1>
    <p class="sub" id="tMeta"></p>
    <div class="card" style="margin-top:8px"><span class="track-badge" id="tStatus">Waiting for kitchen…</span><div id="tItems" style="margin-top:12px"></div></div>
    <a class="btn btn-secondary btn-block" href="/food" style="margin-top:14px">Order again</a>
  </div>
</div>

<div class="cartbar" id="cartbar" onclick="showCheckout()">
  <div class="c" id="cartCount">0 items</div>
  <div class="g" id="cartTotal">₹0 · View cart →</div>
</div>

<script>
function esc(s){return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let PROVIDER=null, MENU=[], cart={}, pollTimer=null;

async function loadProviders(){
  const city=document.getElementById('city').value.trim();
  try{
    const r=await fetch('/api/food/providers'+(city?('?city='+encodeURIComponent(city)):''));const d=await r.json();
    const list=d.providers||[];
    document.getElementById('providers').innerHTML=list.length?list.map(p=>`<div class="prov" onclick="openProvider('${p.id}')"><div class="av">${esc((p.name||'?')[0])}</div><div style="flex:1"><div class="nm">${esc(p.name)} ${p.homefood?'<span class="tag home">Home</span>':''} ${p.featured?'<span class="tag feat">★</span>':''}</div><div class="mt">${esc(p.city||'')}${p.review_count?' · ★ '+p.rating+' ('+p.review_count+')':' · New'}</div></div></div>`).join(''):'<div class="empty">No kitchens here yet.</div>';
  }catch(e){document.getElementById('providers').innerHTML='<div class="empty">Couldn’t load kitchens.</div>';}
}
async function openProvider(id){
  try{
    const r=await fetch('/api/food/menu?id='+id);const d=await r.json();if(!r.ok)throw 0;
    PROVIDER=d.provider;MENU=d.items||[];cart={};
    document.getElementById('mName').textContent=PROVIDER.name;
    document.getElementById('mMeta').textContent=(PROVIDER.homefood?'Home kitchen · ':'')+(PROVIDER.city||'');
    renderMenu();showMenu();
  }catch(e){alert('Couldn’t open this kitchen.');}
}
function renderMenu(){
  document.getElementById('menu').innerHTML=MENU.length?MENU.map(i=>{
    const q=cart[i.id]?.qty||0;
    const ctrl=q>0?`<div class="qty"><span class="qbtn" onclick="chg('${i.id}',-1)">−</span><b>${q}</b><span class="qbtn" onclick="chg('${i.id}',1)">+</span></div>`:`<span class="qadd" onclick="chg('${i.id}',1)">ADD</span>`;
    return `<div class="item"><span class="veg ${i.veg?'y':'n'}"></span><div style="flex:1"><div class="nm">${esc(i.name)}</div>${i.description?`<div class="ds">${esc(i.description)}</div>`:''}<div class="pr">₹${i.price}</div></div>${ctrl}</div>`;
  }).join(''):'<div class="empty">This kitchen hasn’t added dishes yet.</div>';
  updateCart();
}
function chg(id,delta){
  const item=MENU.find(m=>m.id===id);if(!item)return;
  const cur=cart[id]?.qty||0;const q=Math.max(0,cur+delta);
  if(q===0)delete cart[id];else cart[id]={...item,qty:q};
  renderMenu();
}
function cartArr(){return Object.values(cart);}
function cartTotal(){return cartArr().reduce((s,i)=>s+i.price*i.qty,0);}
function updateCart(){
  const items=cartArr();const n=items.reduce((s,i)=>s+i.qty,0);const bar=document.getElementById('cartbar');
  if(n>0){bar.classList.add('on');document.getElementById('cartCount').textContent=n+' item'+(n>1?'s':'');document.getElementById('cartTotal').textContent='₹'+cartTotal()+' · View cart →';}
  else bar.classList.remove('on');
}
function showList(){['menuView','checkoutView','trackView'].forEach(v=>document.getElementById(v).style.display='none');document.getElementById('listView').style.display='block';}
function showMenu(){['listView','checkoutView','trackView'].forEach(v=>document.getElementById(v).style.display='none');document.getElementById('menuView').style.display='block';}
function showCheckout(){
  const items=cartArr();if(!items.length)return;
  const sub=cartTotal();const fee=30;
  document.getElementById('orderSummary').innerHTML=`<div class="card">${items.map(i=>`<div class="sumrow"><span>${i.qty}× ${esc(i.name)}</span><span>₹${i.price*i.qty}</span></div>`).join('')}<div class="sumrow"><span>Delivery</span><span>₹${fee}</span></div><div class="sumrow tot"><span>Total</span><span>₹${sub+fee}</span></div></div>`;
  ['listView','menuView','trackView'].forEach(v=>document.getElementById(v).style.display='none');document.getElementById('checkoutView').style.display='block';
}
async function placeOrder(){
  const name=document.getElementById('oName').value.trim(),phone=document.getElementById('oPhone').value.trim(),addr=document.getElementById('oAddr').value.trim();
  if(!name||phone.replace(/[^0-9]/g,'').length<10||!addr){alert('Please add your name, phone and delivery address.');return;}
  const btn=document.getElementById('placeBtn');btn.disabled=true;btn.textContent='Placing…';
  try{
    const r=await fetch('/api/food/order',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({providerId:PROVIDER.id,items:cartArr().map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty})),customer:{name,phone},address:addr})});
    const d=await r.json();if(!r.ok)throw new Error(d.error||'Failed');
    startTrack(d.orderId);
  }catch(e){btn.disabled=false;btn.textContent='Place order';alert(e.message);}
}
const LBL={placed:'Waiting for kitchen…',accepted:'Kitchen accepted your order',preparing:'Being prepared 👨‍🍳',ready:'Ready — finding a rider',out_for_delivery:'On the way 🛵',delivered:'Delivered ✓',cancelled:'Cancelled'};
function startTrack(id){
  ['listView','menuView','checkoutView'].forEach(v=>document.getElementById(v).style.display='none');document.getElementById('trackView').style.display='block';
  document.getElementById('tMeta').textContent='From '+PROVIDER.name;
  document.getElementById('tItems').innerHTML=cartArr().map(i=>`<div class="sumrow"><span>${i.qty}× ${esc(i.name)}</span><span>₹${i.price*i.qty}</span></div>`).join('');
  const p=()=>fetch('/api/food/order/'+id).then(r=>r.json()).then(d=>{const s=d.order?.status;document.getElementById('tStatus').textContent=LBL[s]||s;if(s==='delivered'||s==='cancelled')clearInterval(pollTimer);}).catch(()=>{});
  p();pollTimer=setInterval(p,5000);
}
addEventListener('scroll',()=>document.getElementById('nav').classList.toggle('scrolled',scrollY>8));
loadProviders();
</script>
</body>
</html>
